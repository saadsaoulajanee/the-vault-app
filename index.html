/* V0.4.4: keep episode cards compact while allowing their questions to scroll */
.episode-questions,
.question-list,
.questions-list,
.episode-card .questions,
.episode-card .question-list {
  max-height: 320px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-right: 6px;
}



/* V0.4.5: fix the actual editor question container and interview spacing */
#epform #editquestions {
  max-height: min(42vh, 360px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 0 8px 0 0;
  scrollbar-gutter: stable;
}
#epform #editquestions .qrow { padding: 9px 0; }
#epform #editquestions .qrow input[aria-label="Question"] {
  min-width: 0;
  max-width: 100%;
}
.hero:has(.interview-select) {
  align-items: flex-start;
  justify-content: flex-start;
  flex-direction: column;
  gap: 12px;
  margin: 8px 0 16px;
}
.hero:has(.interview-select) > div:first-child { width: 100%; }
.hero .interview-select {
  width: min(100%, 440px);
  min-width: 0;
  flex: none;
  align-self: flex-start;
  margin: 0;
}



/* V0.4.6: remove the oversized interview hero gap on narrow screens */
.hero:has(.interview-select) {
  display: flex !important;
  height: auto !important;
  min-height: 0 !important;
  max-height: none !important;
  padding-bottom: 0 !important;
  margin: 8px 0 12px !important;
  align-content: flex-start !important;
  justify-content: flex-start !important;
  gap: 12px !important;
}
.hero:has(.interview-select) > div {
  flex: 0 0 auto !important;
}
.hero:has(.interview-select) + .card {
  margin-top: 0 !important;
}



/* V0.4.7: Vault-styled episode picker instead of Android's native select popup */
.episode-picker-trigger {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  width:100%; min-width:0; min-height:46px; padding:10px 14px;
  border:1px solid var(--line); border-radius:14px; background:#fff;
  color:var(--ink); font:inherit; font-weight:700; text-align:left;
  box-shadow:0 1px 2px rgba(20,30,50,.03); cursor:pointer;
}
.episode-picker-trigger span { flex:0 0 auto; color:var(--muted); font-size:20px; }
.episode-picker-list { display:grid; gap:8px; max-height:60vh; overflow-y:auto; }
.episode-picker-option {
  display:block; width:100%; padding:13px 14px; border:1px solid var(--line);
  border-radius:12px; background:#fff; color:var(--ink); text-align:left;
  font:inherit; font-weight:650; cursor:pointer;
}
.episode-picker-option.selected { border-color:var(--blue); background:var(--softblue); }


/* V0.4.9: consistent Vault-style custom pickers for every native select */
.vault-select-wrap{position:relative;min-width:0;flex:1}
.vault-select-wrap>select{position:absolute!important;inset:0!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}
.vault-select-button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-width:0;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.vault-select-button .vault-select-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vault-select-button .vault-select-chevron{flex:0 0 auto;color:var(--muted)}
.vault-picker-options{display:grid;gap:8px;max-height:60vh;overflow:auto}
.vault-picker-option{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.vault-picker-option.selected{border-color:var(--blue);background:var(--softblue);font-weight:700}

/* V0.5.0: guest project credits */
.project-editor-list{display:grid;gap:8px;margin:8px 0}
.project-editor-row{display:grid;grid-template-columns:minmax(0,1fr) 125px 38px;gap:8px;align-items:center}
.project-editor-row input,.project-editor-row select{min-width:0;width:100%}
.project-strip{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.project-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#f8f9fd;color:var(--muted);font-size:12px;line-height:1.3}
.project-chip strong{color:var(--ink);font-weight:650}
.project-strip-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
@media(max-width:480px){.project-editor-row{grid-template-columns:minmax(0,1fr) 105px 34px}}

/* V0.5.7: themed organizer picker overlay that preserves the convention form */
.organizer-picker-wrap{position:relative}
.organizer-picker-button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.organizer-picker-button:focus-visible{outline:3px solid #8ba2ff;outline-offset:2px}
.organizer-picker-overlay{position:fixed;inset:0;z-index:10050;display:flex;align-items:center;justify-content:center;padding:20px;background:#10182b88}
.organizer-picker-panel{width:min(480px,100%);max-height:75vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 24px 70px #10182b55}
.organizer-picker-title{font-size:18px;font-weight:800;margin:0 0 12px}
.organizer-picker-option{display:block;width:100%;padding:13px 14px;margin:6px 0;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-align:left;font:inherit}
.organizer-picker-option.selected{border-color:var(--blue);background:var(--softblue);font-weight:750}
.checklist-grid{display:grid;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.checkrow{display:flex;width:100%;box-sizing:border-box;align-items:center;gap:9px;font-weight:500}.checkrow input{accent-color:var(--blue)}.checklist-scroll{max-height:230px;overflow-y:auto;overflow-x:hidden;display:block;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.checkrow{display:grid!important;grid-template-columns:20px minmax(0,1fr)!important;justify-content:initial!important;align-items:center!important;width:100%!important;min-width:0!important;box-sizing:border-box;column-gap:10px;font-weight:500;padding:7px 2px;white-space:normal;overflow-wrap:anywhere}.checkrow input{accent-color:var(--blue);margin:0!important;display:block;width:20px;height:20px;justify-self:start}.checkrow span{display:block;min-width:0;width:100%;text-align:left;white-space:normal;overflow-wrap:anywhere;word-break:normal}
/* V1.2.1: keep the episode editor mounted while choosing a dropdown value */
.vault-select-overlay{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(16,24,43,.58)}
.vault-select-panel{width:min(460px,100%);max-height:min(78vh,680px);overflow:hidden;display:flex;flex-direction:column;background:var(--paper,#fff);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 70px rgba(10,20,40,.28)}
.vault-select-panel .modhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.vault-select-panel .modalbody{padding:14px;overflow-y:auto;overscroll-behavior:contain}
.vault-select-panel .vault-picker-options{max-height:60vh;overflow-y:auto}


/* V1.2.2 additions */
.episode-number{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--blue);background:var(--softblue);border-radius:7px;padding:3px 7px;margin-right:5px;vertical-align:2px}
.episode-cancelled{opacity:.78;border-style:dashed}
.number-cancelled{background:#fff0f0;color:#b42318;text-decoration:line-through}
.interview-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.interview-controls .field{min-width:0;margin:0}
.kpi-grid{margin-bottom:16px}
.kpi-sections{margin-bottom:16px}
.kpi-list{display:grid;gap:13px;margin-top:16px}
.kpi-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,1.2fr) 28px;gap:10px;align-items:center;margin:12px 0}
.kpi-label{min-width:0;overflow-wrap:anywhere;font-size:13px;font-weight:650}
.kpi-track{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.kpi-track i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.kpi-row>b{text-align:right;font-variant-numeric:tabular-nums}
.kpi-convention{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kpi-convention:last-child{border-bottom:0}
.kpi-convention>strong{font-size:22px}
@media(max-width:560px){.interview-controls{grid-template-columns:1fr}.kpi-row{grid-template-columns:minmax(0,1fr) 70px 24px}.kpi-sections{grid-template-columns:1fr}}


/* V1.3.0 CRM and command-centre styling */
.guest-grid,.convention-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:16px}
.guest-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}.guest-head img,.guest-avatar{width:58px;height:58px;flex:none;border-radius:16px;object-fit:cover;background:linear-gradient(135deg,#eaf0ff,#fff0f7);display:grid;place-items:center;font-size:24px}
.guest-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.kanban-lane.drop-target{outline:2px dashed var(--blue);outline-offset:2px;background:#e6ebff}
.kanban-lane .episode[draggable="true"]{cursor:grab;user-select:none}.kanban-lane .episode.dragging,.kanban-lane .episode.touch-dragging{opacity:.45;outline:2px solid var(--blue)}
@media(max-width:600px){.guest-grid,.convention-overview{grid-template-columns:1fr}}
/* V1.2.7 episode library layouts and question review */
.episode-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.episode-gallery .episode{min-width:0;align-items:flex-start}
.episode-gallery .epactions{flex-direction:column;align-items:flex-end}
.episode-kanban{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;align-items:flex-start}
.kanban-lane{flex:0 0 270px;max-width:270px;background:#eef1f8;border:1px solid var(--line);border-radius:15px;padding:11px;min-height:180px}
.kanban-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:13px;margin-bottom:10px}
.kanban-count{background:#fff;border-radius:99px;padding:2px 8px;color:var(--muted);font-size:11px}
.kanban-lane .stack{gap:8px}
.kanban-lane .episode{padding:10px;align-items:flex-start}
.kanban-lane .epicon{width:34px;height:34px;font-size:17px}
.kanban-lane .epactions{display:flex;flex-direction:column;align-items:stretch;gap:5px}.kanban-lane .epactions .status{white-space:normal;text-align:center}
.episode-view-toggle{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
.episode-view-toggle button.active{background:var(--ink);color:#fff}
.question-review-row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.question-review-row input{margin-top:4px;accent-color:var(--blue);width:18px;height:18px;flex:none}
.question-review-row span{flex:1;min-width:0}
@media(max-width:600px){.episode-gallery{grid-template-columns:1fr}.kanban-lane{flex-basis:250px}}


/* V1.2.7: Kanban cards use a full-width, two-row layout instead of squeezing title text */
.episode-kanban{width:100%;max-width:100%;box-sizing:border-box;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.kanban-lane{box-sizing:border-box;flex:0 0 min(310px,86vw);width:min(310px,86vw);max-width:min(310px,86vw);min-width:0}
.kanban-lane .episode{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;width:100%;min-width:0;box-sizing:border-box;align-items:start}
.kanban-lane .epicon{grid-column:1;grid-row:1;width:34px;height:34px}
.kanban-lane .epbody{grid-column:2;grid-row:1;min-width:0;width:100%}
.kanban-lane .epbody b{white-space:normal;overflow-wrap:anywhere;word-break:normal;line-height:1.35}
.kanban-lane .epmeta{overflow-wrap:anywhere;line-height:1.45}
.kanban-lane .epactions{grid-column:1/-1;grid-row:2;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;min-width:0}
.kanban-lane .epactions .status{white-space:normal;text-align:left;max-width:100%}
.kanban-lane .epactions .btn{flex:0 0 auto}
.kanban-lane .bar{grid-column:1/-1}
@media(max-width:600px){.kanban-lane{flex-basis:min(290px,84vw);width:min(290px,84vw);max-width:min(290px,84vw)}}



.day-picker-wrap{margin:14px 0 16px}
.day-picker-label{font-size:10px;font-weight:850;letter-spacing:1.3px;color:var(--muted);margin:0 0 7px 2px}
.panel-day-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0}
.panel-day-tabs button.day-toggle{appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:58px;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:background .15s ease,border-color .15s ease,box-shadow .15s ease}
.panel-day-tabs button.day-toggle .day-toggle-name{display:block;color:inherit;font-size:15px;line-height:1.15}
.panel-day-tabs button.day-toggle .day-toggle-state{font-size:9px;line-height:1.1;letter-spacing:1.1px;color:var(--muted);font-weight:850}
.panel-day-tabs button.day-toggle.active{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 3px 9px rgba(0,0,0,.18)}
.panel-day-tabs button.day-toggle.active .day-toggle-state{color:rgba(255,255,255,.86)}
.panel-day-tabs button.day-toggle:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media(min-width:700px){.panel-day-tabs button.day-toggle{min-height:54px}}

.panel-day-tabs button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:9px 14px;font-weight:700}
.panel-day-tabs button.active{background:var(--accent);color:white;border-color:var(--accent)}
.schedule-item{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;align-items:start;padding:9px 2px;border-bottom:1px solid var(--line);min-width:0}
.schedule-item:last-child{border-bottom:0}

body[data-theme="dark"]{color-scheme:dark;--ink:#edf0fa;--muted:#a0a9bd;--line:#30394d;--paper:#111827;--card:#1b2435;--blue:#8ba4ff;--pink:#f08bb8;--softblue:#263454;--softpink:#3a2637;--shadow:0 12px 34px #0004}
body[data-theme="dark"] .pill,body[data-theme="dark"] .episode,body[data-theme="dark"] .modal,body[data-theme="dark"] .field input,body[data-theme="dark"] .field select,body[data-theme="dark"] .field textarea,body[data-theme="dark"] .vault-select-button,body[data-theme="dark"] .episode-picker-trigger,body[data-theme="dark"] .vault-picker-option,body[data-theme="dark"] .episode-picker-option,body[data-theme="dark"] .organizer-picker-button{background:#202b40;color:var(--ink);border-color:var(--line)}
body[data-theme="dark"] .btn.secondary,body[data-theme="dark"] .x,body[data-theme="dark"] .kanban-lane{background:#29344a;color:var(--ink)}
body[data-theme="dark"] .nav button{color:var(--muted)}body[data-theme="dark"] .nav button.active{background:var(--blue);color:#101827}
body[data-theme="dark"] .project-chip,body[data-theme="dark"] .status,body[data-theme="dark"] .kanban-count{background:#29344a;color:var(--ink)}
.theme-toggle{min-width:42px}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:9px}.metric-tile{border:1px solid var(--line);border-radius:12px;padding:12px}.metric-tile strong{display:block;font-size:22px}.expense-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.month-cell{min-height:75px;padding:5px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:11px;overflow:hidden}.month-cell .cal-event{display:block;margin-top:4px;padding:3px;background:var(--softblue);border-radius:5px;font-size:9px}
@media(max-width:520px){.month-cell{min-height:60px;padding:3px}.month-grid{gap:3px}}

/* V2.1.0 budget dashboard + venue floor-plan editor */
.budget-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;margin:0 0 16px}
.budget-toolbar .field{margin:0;min-width:0}
.budget-select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:13px;padding:10px 14px;background:var(--card);color:var(--ink);font-weight:700}
.budget-overview{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center}
.budget-ring{width:142px;height:142px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--blue) var(--spent-angle,0deg),#e9edf5 0)}
.budget-ring:before{content:"";position:absolute;inset:13px;background:var(--card);border-radius:50%}
.budget-ring-center{position:relative;text-align:center;display:grid;gap:1px}
.budget-ring-center strong{font-size:23px;letter-spacing:-1px}
.budget-ring-center span{font-size:11px;color:var(--muted)}
.budget-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.budget-legend-item{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0}
.budget-legend-item span{display:block;font-size:12px;color:var(--muted)}
.budget-legend-item strong{display:block;font-size:19px;margin-top:3px;overflow-wrap:anywhere}
.budget-progress{height:12px;background:#e9edf5;border-radius:99px;overflow:hidden;margin-top:15px}
.budget-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--pink));border-radius:99px;transition:width .35s}
.budget-expenses{display:grid;gap:8px;margin-top:14px}
.budget-expense{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--card)}
.budget-expense-main{min-width:0}.budget-expense-main b{display:block;overflow-wrap:anywhere}
.budget-expense-amount{font-weight:800;white-space:nowrap}
.budget-limit-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:14px}
.budget-limit-row .field{margin:0}
.budget-remaining-tile{border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:var(--paper)}
.budget-remaining-tile span{display:block;font-size:12px;color:var(--muted)}
.budget-remaining-tile strong{font-size:20px;display:block;margin-top:3px}
.budget-card{padding:18px}
.budget-card .sectionhead{align-items:flex-start}
.floorplan-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.floorplan-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.floorplan-tab{padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-weight:650}
.floorplan-tab.active{background:var(--softblue);border-color:#aebeff;color:#4059bb}
.floorplan-stage{position:relative;width:100%;min-height:220px;background:#f1f3f8;border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:pan-y}
.floorplan-stage img{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain;user-select:none;-webkit-user-drag:none}
.floorplan-marker{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);padding:6px 9px;border-radius:9px;background:#4169e9;color:#fff;font-size:12px;font-weight:800;box-shadow:0 3px 12px #17264b55;white-space:nowrap;max-width:75%;overflow:hidden;text-overflow:ellipsis;touch-action:none;cursor:grab;border:2px solid #fff}
.floorplan-marker[data-kind="panel"]{background:#7654c8}.floorplan-marker[data-kind="interview"]{background:#e04f92}.floorplan-marker[data-kind="photoshoot"]{background:#d17b24}.floorplan-marker[data-kind="autographs"]{background:#16866b}.floorplan-marker[data-kind="meeting"]{background:#4169e9}
.floorplan-empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.floorplan-help{font-size:12px;color:var(--muted);margin:8px 0}
.venue-plan-card{margin-top:14px}
@media(max-width:600px){.budget-toolbar{grid-template-columns:1fr}.budget-overview{grid-template-columns:1fr;justify-items:center}.budget-legend{width:100%}.budget-limit-row{grid-template-columns:1fr}.budget-expense{grid-template-columns:minmax(0,1fr) auto}.budget-expense .btn{grid-column:2}.floorplan-marker{font-size:10px;padding:5px 7px}}


.weekend-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.weekend-grid .weekend-cell{min-height:94px}
.weekend-grid .weekend-empty{background:transparent;border:0}

.flight-prominent{padding:16px 0}

.week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}

/* V4 refined interface / shared design tokens */
:root{--panel:#f0f2f9;--text:var(--ink);--accent:var(--blue);--danger:#b63d52;--danger-bg:#fff0f2;--radius-md:12px;--radius-lg:16px;--tap-size:42px}
body[data-theme="dark"]{--panel:#222d40;--text:var(--ink);--accent:var(--blue);--danger-bg:#452b36;--danger:#ff9ca9}
body{line-height:1.43}
.app{max-width:1320px}
.hero{margin:5px 0 16px;gap:12px}
.hero h1{font-size:clamp(25px,3.6vw,33px);line-height:1.15}
.hero .sub{font-size:13px}
.card{border-radius:var(--radius-lg);padding:15px;box-shadow:0 4px 17px rgba(22,32,57,.045)}
.sectionhead{gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sectionhead h2{margin:0;font-size:18px}
.btn{border-radius:10px;min-height:38px;transition:background .15s,filter .15s}
.btn:hover{filter:brightness(.98)}
.btn:active{transform:translateY(1px)}
.btn.small{min-height:34px}
button:focus-visible,summary:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
:where(input,select,textarea){accent-color:var(--blue)}
[hidden]{display:none!important}
.tag{white-space:normal}
/* compact top navigation & utilities */
.top{margin-bottom:12px;gap:12px}
.topright{gap:7px;flex-wrap:wrap}
.topright .btn{white-space:nowrap}
.header-tools{position:relative}
.header-tools summary{display:flex;align-items:center;list-style:none;cursor:pointer;white-space:nowrap}
.header-tools summary::-webkit-details-marker{display:none}
.header-tools-menu{position:absolute;z-index:19;top:calc(100% + 8px);right:0;min-width:198px;display:grid;gap:5px;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:0 14px 32px rgba(10,20,36,.17)}
.header-tools-menu .btn{width:100%;text-align:left}
.nav{gap:4px;margin-bottom:15px}
.nav button{padding:9px 12px;font-size:13px;border-radius:10px}
.vault-mobile-nav{display:none}
.vault-more-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 16px}
.vault-more-links .btn{text-align:left}
.vault-backup-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:12px 0}
.vault-search-results{max-height:65vh;overflow-y:auto;display:grid;gap:5px}
.vault-search-result{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border-radius:10px;padding:10px 12px;color:var(--ink)}
.vault-search-result span:first-child{min-width:0}
.vault-search-result b{display:block;font-size:13px;overflow-wrap:anywhere}
.vault-search-result small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
/* convention hub */
.hub-filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.hub-filter-bar button,.kpi-tabs button{padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font-size:13px;font-weight:750}
.hub-filter-bar button.active,.kpi-tabs button.active{background:var(--ink);border-color:var(--ink);color:var(--card)}
.convention-overview{gap:12px}
.convention-hub-merged-card{padding:15px}
.convention-hub-merged-card .sectionhead h3{margin:0}
.convention-hub-merged-card .convention-countdown{margin:6px 0}
.convention-guest-preview{display:flex;align-items:center;gap:0;min-height:36px;margin:8px 0 6px}
.convention-guest-preview img,.convention-guest-preview>span:not(.preview-more){width:34px;height:34px;min-width:34px;border:2px solid var(--card);border-radius:50%;object-fit:cover;background:var(--softblue);color:var(--ink);display:grid;place-items:center;font-size:9px;font-weight:800;margin-right:-7px}
.convention-guest-preview .preview-more{font-size:10px;font-weight:800;margin-left:14px;color:var(--blue)}
.convention-guest-preview small{font-size:11px;color:var(--muted);margin-left:auto}
.convention-card-list{margin:6px 0}
.convention-card-list summary{font-size:11px;color:var(--blue);cursor:pointer}
.convention-card-actions{margin-top:8px;padding-top:9px;gap:6px}
.convention-card-actions .btn{min-height:34px}
.hub-empty{grid-column:1/-1;width:100%}
/* guest progressive directory */
.guest-directory-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-bottom:15px}
.guest-directory-toolbar input,.guest-directory-toolbar select{flex:1 1 180px;min-width:0;min-height:43px;border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:var(--card);color:var(--ink)}
.guest-directory-toolbar .vault-select-wrap{flex:0 1 230px}
.guest-directory-toolbar .smalltext{margin-left:auto}
.guest-directory-card{content-visibility:auto;contain-intrinsic-size:auto 230px;min-width:0}
.guest-directory-card .guest-head{margin-bottom:7px}
.guest-directory-card .guest-conventions{margin:7px 0}
.load-more-wrap{text-align:center;margin:14px 0 20px}
/* prep list / editing controls */
.task-list-compact{grid-template-columns:1fr!important}
.day-task-row{gap:7px;padding:6px 8px;min-height:37px}
.day-task-label{flex:1;min-width:0}
.task-inline-actions{display:flex;align-items:center;gap:2px;flex:none}
.task-inline-actions button{height:28px;min-width:25px;padding:0 4px;border-radius:7px;background:var(--panel);color:var(--muted);font-size:14px}
.task-inline-actions button:disabled{opacity:.25}
.task-inline-actions .remove{color:var(--danger)}
.task-actions{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.setup-reminder-grid input{width:100%;min-width:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px;font-size:18px;font-weight:800}
.day-contact-section{border:1px solid var(--line);border-radius:12px;margin:9px 0 14px;padding:9px 12px;background:var(--panel)}
.day-contact-section summary{font-size:12px;font-weight:800;cursor:pointer}
.day-contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.day-contact-card{padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.day-contact-card b,.day-contact-card small{display:block}
.day-contact-card small{color:var(--muted);font-size:11px}
.day-contact-actions{display:flex;gap:5px;margin-top:8px}
.day-contact-actions .btn{display:inline-flex;width:auto!important;flex:0 0 auto}
/* interview + shortlist */
.question-library-actions,.idea-actions{display:flex;align-items:center;flex-wrap:wrap;gap:5px}
.question-library-actions .btn{font-size:11px;padding:6px 8px}
.filmography-idea{gap:8px;padding:8px 0}
.shortlist-entry{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.shortlist-entry>span{flex:1;min-width:0;overflow-wrap:anywhere}
.shortlist-entry-tools{display:flex;gap:4px;flex-wrap:wrap}
/* KPI panels */
.kpi-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 15px}
.kpi-panel[hidden]{display:none!important}
/* focus mode */
.focus-mode .modal{width:min(650px,100%);background:var(--card)}
.focus-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.focus-header h2{margin:0}
.focus-event{padding:16px;border:1px solid var(--line);border-radius:13px;background:var(--panel);margin:9px 0;display:grid;gap:6px}
.focus-event strong{font-size:clamp(19px,3vw,26px);line-height:1.2}
.focus-event .btn{justify-self:start}
.focus-other-events{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.focus-other-events summary{font-size:13px;font-weight:800;cursor:pointer}
.focus-event-line{display:grid;grid-template-columns:60px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}

function preserveVaultSafetyBackup(reason="Before important change"){
 try{const raw=localStorage.getItem("vault03");if(!raw)return;

function syncEpisodeBudgetExpenses(){
 const episodes=Array.isArray(db.episodes)?db.episodes:[];
 const conventions=Array.isArray(db.conventions)?db.conventions:[];
 let changed=false;
 // Keep automatic costs for every non-cancelled episode, including published ones.
 // Published interviews still incurred editing and marketing costs.
 const eligible=episodes.filter(ep=>ep&&ep.id&&ep.conventionId&&Number(ep.status)!==10);
 const eligibleKeys=new Set(eligible.flatMap(ep=>["editing","marketing"].map(kind=>String(ep.id)+"|"+kind)));
 for(const c of conventions){
  if(!Array.isArray(c.expenses))c.expenses=[];
  const before=c.expenses.length;
  c.expenses=c.expenses.filter(x=>!x.autoEpisodeExpense||(
   eligibleKeys.has(String(x.episodeId)+"|"+String(x.autoEpisodeExpense))&&
   eligible.some(ep=>String(ep.id)===String(x.episodeId)&&String(ep.conventionId)===String(c.id))
  ));
  if(c.expenses.length!==before)changed=true;
  for(const ep of eligible.filter(e=>String(e.conventionId)===String(c.id))){
   for(const kind of ["editing","marketing"]){
    let matches=c.expenses.filter(x=>x.autoEpisodeExpense===kind&&String(x.episodeId)===String(ep.id));
    if(matches.length>1){
     const keep=matches[0];
     c.expenses=c.expenses.filter(x=>x===keep||!(x.autoEpisodeExpense===kind&&String(x.episodeId)===String(ep.id)));
     changed=true;
    }
    let x=matches[0];
    if(!x){x={id:uid(),episodeId:ep.id,autoEpisodeExpense:kind};c.expenses.push(x);changed=true}
    const title=(kind==="editing"?"Editing":"Marketing")+" Episode: "+(ep.guest||"Unnamed guest");
    const configured=Number(db.settings?.autoCosts?.[kind]);
    const defaultAmount=Number.isFinite(configured)&&configured>=0?configured:50;
    const override=ep.autoCostOverrides?.[kind];
    const amount=(override!==null&&override!==undefined&&String(override)!==""&&Number.isFinite(Number(override))&&Number(override)>=0)?Number(override):defaultAmount;
    const values={title,amount,date:c.startDate||"",category:kind};
    for(const [key,value] of Object.entries(values)){if(x[key]!==value){x[key]=value;changed=true}}
    if("episodeStatus" in x){delete x.episodeStatus;changed=true}
   }
  }
 }
 return changed;
}
const VAULT_PREP_SHADOW_KEY="vault_day_preparation_v402";
const VAULT_PREP_FIELDS={checklist:"_packingUpdatedAt",preConTasks:"_preConUpdatedAt",setupTasks:"_setupTasksUpdatedAt",setupConfig:"_setupConfigUpdatedAt"};
function readPreparationShadow(){try{const x=JSON.parse(localStorage.getItem(VAULT_PREP_SHADOW_KEY)||"{}");return x&&typeof x==="object"?x:{}}catch{return {}}}
function writePreparationShadow(shadow){try{localStorage.setItem(VAULT_PREP_SHADOW_KEY,JSON.stringify(shadow))}catch(err){console.warn("Could not preserve the preparation backup",err)}}
function isMeaningfulPreparation(c,field){
 const value=c?.[field];
 if(field==="checklist")return Array.isArray(value)&&value.some(Boolean);
 if(field==="preConTasks"||field==="setupTasks"){
  if(!Array.isArray(value))return false;
  const defaults=(field==="preConTasks"?(db.taskTemplates?.preCon||DEFAULT_PRECON_TASKS):(db.taskTemplates?.setup||DEFAULT_SETUP_TASKS));
  return value.some(x=>x?.done)||JSON.stringify(value.map(x=>x?.text))!==JSON.stringify(defaults);
 }
 if(field==="setupConfig")return !!value&&(value.tripodHeight!=="115–125 cm"||value.tripodTilt!=="0°–5°");
 return false;
}
function recordPreparationChanges(){
 // Compare with the previously saved document: all existing edit/check/add/remove paths are covered.
 let previous={};try{previous=JSON.parse(localStorage.getItem("vault03")||"{}")||{}}catch{}
 const prevById=new Map((previous.conventions||[]).map(c=>[String(c.id),c]));
 const shadow=readPreparationShadow();shadow.conventions=shadow.conventions||{};
 let updated=false;
 for(const c of db.conventions||[]){
  const old=prevById.get(String(c.id));
  const entry=shadow.conventions[c.id]||{};
  for(const [field,timeField] of Object.entries(VAULT_PREP_FIELDS)){
   if(!Object.prototype.hasOwnProperty.call(c,field))continue;
   if(JSON.stringify(c[field])===JSON.stringify(old?.[field]))continue;
   const now=Date.now();c[timeField]=now;
   entry[field]={updatedAt:now,value:JSON.parse(JSON.stringify(c[field]))};
   updated=true;
  }
  if(Object.keys(entry).length)shadow.conventions[c.id]=entry;
 }
 if(JSON.stringify(previous.checklistTemplate)!==JSON.stringify(db.checklistTemplate)){
  const now=Date.now();db._checklistTemplateUpdatedAt=now;
  shadow.packingTemplate={updatedAt:now,value:[...(db.checklistTemplate||[])]};updated=true;
 }
 if(updated)writePreparationShadow(shadow);
}
function initializePreparationSafety(){
 // One-time migration for users who edited preparation lists before this version.
 const shadow=readPreparationShadow();
 if(shadow.migrated402){
  // Also recover local preparation edits if an older data snapshot was restored before startup.
  if(mergeNewerLocalPreparation(db)){
   try{localStorage.setItem("vault03",JSON.stringify(db))}catch(err){console.warn("Could not recover locally backed-up preparation",err)}
  }
  return;
 }
 shadow.conventions=shadow.conventions||{};
 let changed=false;
 for(const c of db.conventions||[]){
  const entry=shadow.conventions[c.id]||{};
  for(const [field,timeField] of Object.entries(VAULT_PREP_FIELDS)){
   if(!Object.prototype.hasOwnProperty.call(c,field)||!isMeaningfulPreparation(c,field))continue;
   const when=Number(c[timeField])||Date.now();c[timeField]=when;
   entry[field]={updatedAt:when,value:JSON.parse(JSON.stringify(c[field]))};changed=true;
  }
  if(Object.keys(entry).length)shadow.conventions[c.id]=entry;
 }
 if(Array.isArray(db.checklistTemplate)&&JSON.stringify(db.checklistTemplate)!==JSON.stringify(DEFAULT_CHECKLIST)){
  const when=Number(db._checklistTemplateUpdatedAt)||Date.now();db._checklistTemplateUpdatedAt=when;
  shadow.packingTemplate={updatedAt:when,value:[...db.checklistTemplate]};changed=true;
 }
 shadow.migrated402=true;writePreparationShadow(shadow);
 if(changed){try{localStorage.setItem("vault03",JSON.stringify(db))}catch(err){console.warn("Could not migrate preparation timestamps",err)}}
}
function mergeNewerLocalPreparation(incoming){
 const shadow=readPreparationShadow();let restored=false;
 for(const c of incoming.conventions||[]){
  const entry=shadow.conventions?.[c.id];if(!entry)continue;
  for(const [field,timeField] of Object.entries(VAULT_PREP_FIELDS)){
   const safe=entry[field];if(!safe||!Number.isFinite(Number(safe.updatedAt)))continue;
   if(Number(safe.updatedAt)>Number(c[timeField]||0)){
    c[field]=JSON.parse(JSON.stringify(safe.value));c[timeField]=Number(safe.updatedAt);restored=true;
   }
  }
 }
 if(shadow.packingTemplate&&Number(shadow.packingTemplate.updatedAt)>Number(incoming._checklistTemplateUpdatedAt||0)){
  incoming.checklistTemplate=[...shadow.packingTemplate.value];
  incoming._checklistTemplateUpdatedAt=Number(shadow.packingTemplate.updatedAt);restored=true;
 }
 return restored;
}
function save(){

}

function setSyncStatus(label){const el=document.getElementById("syncStatus");if(el)el.textContent=label;}
function scheduleCloudSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow("both"),1200);}
function cloudPayload(){return {guests:db.guests,organizers:db.organizers,conventions:db.conventions,episodes:db.episodes,checklistTemplate:db.checklistTemplate,settings:db.settings,venues:db.venues,youtubeVideos:db.youtubeVideos,taskTemplates:db.taskTemplates||{},_checklistTemplateUpdatedAt:db._checklistTemplateUpdatedAt||0};}
// Compare the actual data, not JSON property ordering. Supabase can return the same
// JSON object with a different key order, which is not a sync conflict.
function canonicalCloudSnapshot(value){
 const seen=new WeakSet();
 function order(v){
  if(Array.isArray(v))return v.map(order);
  if(v&&typeof v==="object"){
   if(seen.has(v))throw new Error("Circular cloud data");
   seen.add(v);
   const out={};for(const k of Object.keys(v).sort())if(v[k]!==undefined)out[k]=order(v[k]);
   seen.delete(v);return out;
  }
  return v;
 }
 return JSON.stringify(order(value));
}
function cloudBaseKey(ownerId){return "vault_cloud_baseline_v405_"+String(ownerId||"");}
function restoreCloudBaseline(){
 lastCloudPayload=null;
 if(!cloudUser?.id)return;
 try{const saved=localStorage.getItem(cloudBaseKey(cloudUser.id));if(saved)lastCloudPayload=saved;}catch{}
}
function rememberCloudBaseline(payload){try{localStorage.setItem('vault_last_sync_at_v410',new Date().toISOString())}catch{}
 lastCloudPayload=canonicalCloudSnapshot(payload);
 if(cloudUser?.id){try{localStorage.setItem(cloudBaseKey(cloudUser.id),lastCloudPayload)}catch(err){console.warn("Could not cache cloud sync baseline",err)}}
}
async function pushCloudPayload(payload){
 const {error}=await supabaseClient.from("vault_sync_state").upsert({owner_id:cloudUser.id,payload,updated_at:new Date().toISOString()},{onConflict:"owner_id"});
 if(error)throw error;
 rememberCloudBaseline(payload);
}
function applyCloudPayload(payload){
 if(!payload || !Array.isArray(payload.organizers)||!Array.isArray(payload.conventions)||!Array.isArray(payload.episodes))throw new Error("The cloud data format is not valid.");
 preserveVaultSafetyBackup("Before cloud replacement");
 applyingRemote=true;
 let prepRestored=false,migratedProjects=false;
 try{
  db={...db,guests:Array.isArray(payload.guests)?payload.guests:[],organizers:payload.organizers,conventions:payload.conventions,episodes:payload.episodes,checklistTemplate:Array.isArray(payload.checklistTemplate)?payload.checklistTemplate:DEFAULT_CHECKLIST.slice(),settings:payload.settings||db.settings||{theme:"system",youtubeApiKey:""},venues:Array.isArray(payload.venues)?payload.venues.map(v=>({...v,floorPlans:v.floorPlans||[]})):[],youtubeVideos:Array.isArray(payload.youtubeVideos)?payload.youtubeVideos:[],taskTemplates:payload.taskTemplates&&typeof payload.taskTemplates==="object"?payload.taskTemplates:(db.taskTemplates||{}),_checklistTemplateUpdatedAt:Number(payload._checklistTemplateUpdatedAt)||0};
  prepRestored=mergeNewerLocalPreparation(db);ensureGuestProfiles();
  migratedProjects=migrateGuestProjects();syncEpisodeBudgetExpenses();
  localStorage.setItem("vault03",JSON.stringify(db));
  rememberCloudBaseline(payload);render();
 }finally{applyingRemote=false;}
 // Locally newer preparation details are preserved and will be uploaded rather
 // than being silently replaced by an older cloud copy.
 if((migratedProjects||prepRestored)&&cloudUser&&navigator.onLine)scheduleCloudSync();
}
async function syncNow(mode="both"){
 if(!cloudUser||!supabaseClient||!navigator.onLine)return;
 if(syncBusy)return;
 syncBusy=true;setSyncStatus("Syncing…");
 try{
  const ownerId=cloudUser.id;
  const {data:remote,error}=await supabaseClient.from("vault_sync_state").select("payload,updated_at").eq("owner_id",ownerId).maybeSingle();
  if(error)throw error;
  if(!cloudUser||cloudUser.id!==ownerId)return;
  const local=cloudPayload(),localText=canonicalCloudSnapshot(local);
  const remotePayload=remote?.payload;
  const remoteText=remotePayload?canonicalCloudSnapshot(remotePayload):null;
  if(mode==="pull"){
   if(remotePayload){
    if(localText!==remoteText)applyCloudPayload(remotePayload);
    else rememberCloudBaseline(remotePayload);
    setSyncStatus("Synced just now");
   }else setSyncStatus("Cloud is empty • ready to upload");
   return;
  }
  if(mode==="push"){
   if(remoteText!==localText)await pushCloudPayload(local);
   else rememberCloudBaseline(remotePayload);
   setSyncStatus("Synced just now");return;
  }
  if(!remotePayload){await pushCloudPayload(local);setSyncStatus("First cloud backup complete");return;}
  // This comparison must happen before any question about which copy to keep.
  if(localText===remoteText){rememberCloudBaseline(remotePayload);setSyncStatus("Everything is synced");return;}
  // If we have a known shared ancestor, only a true two-sided change is a conflict.
  // A change to just one side can be synchronized without interrupting the user.
  if(lastCloudPayload){
   if(localText===lastCloudPayload){applyCloudPayload(remotePayload);setSyncStatus("Downloaded changes from cloud");return;}
   if(remoteText===lastCloudPayload){await pushCloudPayload(local);setSyncStatus("Changes uploaded");return;}
  }else{
   // No previous sync on this device: an empty local workspace may safely download.
   const hasLocal=local.organizers.length||local.conventions.length||local.episodes.length;
   if(!hasLocal){applyCloudPayload(remotePayload);setSyncStatus("Downloaded cloud data");return;}
  }
  // The copies actually differ and neither can be proved to be an unchanged base.
  const choice=confirm("The cloud and this device contain different data. OK = keep the cloud version. Cancel = keep this device's version and upload it.");
  if(choice){applyCloudPayload(remotePayload);setSyncStatus("Cloud version kept");}
  else{await pushCloudPayload(local);setSyncStatus("Device version kept and uploaded");}
 }catch(err){setSyncStatus("Sync error");console.error("Vault sync error",err);alert("The Vault could not sync: "+(err.message||String(err)));}
 finally{syncBusy=false;}
}
async function startRealtime(){
 if(!cloudUser||!supabaseClient)return;
 if(cloudChannel)await supabaseClient.removeChannel(cloudChannel);
 cloudChannel=supabaseClient.channel("vault-sync-"+cloudUser.id).on("postgres_changes",{event:"*",schema:"public",table:"vault_sync_state",filter:"owner_id=eq."+cloudUser.id},payload=>{
  if(syncBusy)return;
  const remote=payload.new?.payload;if(!remote)return;
  const local=canonicalCloudSnapshot(cloudPayload()),incoming=canonicalCloudSnapshot(remote);
  if(local===incoming){rememberCloudBaseline(remote);setSyncStatus("Everything is synced");return;}
  if(lastCloudPayload&&local===lastCloudPayload){applyCloudPayload(remote);setSyncStatus("Live update received");}
  else setSyncStatus("Another device changed data • sync to resolve");
 }).subscribe();
}
async function openAccountSync(){
 if(!supabaseClient){alert("Supabase client unavailable. Connect to the internet and reload.");return;}
 const {data:{session},error}=await supabaseClient.auth.getSession();if(error){alert(error.message);return;}
 if(session){cloudUser=session.user;showModal("The Vault account",`<p class="sub">Signed in as <b>${esc(cloudUser.email||"")}</b></p><p class="smalltext">Your data is saved locally and synchronized with your private cloud account when online.</p><div class="row"><button class="btn blue" id="syncNowBtn">Sync now</button><button class="btn secondary" id="signoutBtn">Sign out</button></div>`);document.getElementById("syncNowBtn").onclick=async()=>{closeModal();await syncNow("both")};document.getElementById("signoutBtn").onclick=async()=>{await supabaseClient.auth.signOut();cloudUser=null;cloudAuthOwner=null;cloudAuthStarted=false;if(cloudChannel)await supabaseClient.removeChannel(cloudChannel);cloudChannel=null;lastCloudPayload=null;closeModal();setSyncStatus("Offline-first • not signed in")};return;}
 showModal("Sign in to The Vault",`<p class="sub">Enter your email and we’ll send you a secure sign-in link.</p><form id="cloudlogin"><div class="field"><label>Email address</label><input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><button class="btn blue">Send sign-in link</button></form>`);
 document.getElementById("cloudlogin").onsubmit=async e=>{e.preventDefault();const email=new FormData(e.target).get("email");const {error}=await supabaseClient.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});if(error)alert(error.message);else{closeModal();alert("Sign-in link sent. Open it in this same browser, then return to The Vault.");}};
}
async function initializeCloud(){
 if(!supabaseClient)return;
 async function useSession(session){
  const user=session?.user;
  if(!user){
   cloudUser=null;cloudAuthOwner=null;cloudAuthStarted=false;lastCloudPayload=null;
   if(cloudChannel){const old=cloudChannel;cloudChannel=null;await supabaseClient.removeChannel(old);}
   setSyncStatus("Offline-first • not signed in");return;
  }
  // getSession() and onAuthStateChange(INITIAL_SESSION / SIGNED_IN) often
  // announce the same user on a refresh. Do not start two sync cycles.
  if(cloudAuthOwner===user.id&&cloudAuthStarted){cloudUser=user;return;}
  cloudUser=user;cloudAuthOwner=user.id;cloudAuthStarted=true;
  restoreCloudBaseline();setSyncStatus("Signed in • connecting…");
  await syncNow("both");
  if(cloudAuthOwner===user.id)await startRealtime();
 }
 // Register once; Supabase will provide INITIAL_SESSION. This avoids racing a
 // second getSession() request against the authentication callback.
 supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event==="TOKEN_REFRESHED"&&session?.user?.id===cloudAuthOwner)return;
  // Schedule outside the Supabase auth callback to avoid re-entrant auth calls.
  setTimeout(()=>{useSession(session).catch(err=>{console.error("Vault auth sync error",err);setSyncStatus("Sync error")})},0);
 });
}
window.addEventListener("online",()=>{if(cloudUser){setSyncStatus("Back online • syncing…");syncNow("both");}});
window.addEventListener("offline",()=>setSyncStatus("Offline • changes saved on this device"));
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&cloudUser&&navigator.onLine)syncNow("both");});

function conv(id){const c=db.conventions.find(x=>x.id===id);if(c){if(!Array.isArray(c.guestIds))c.guestIds=[];if(!Array.isArray(c.panels))c.panels=[]}return c}

function guestEpisodes(g){return db.episodes.filter(e=>e.guestId===g.id||normalizeGuestName(e.guest)===normalizeGuestName(g.name))}

ult-pronunciation-fields"><h3>🔊 Name pronunciation guide</h3><p class="smalltext">Save a pronunciation you have confirmed, not an automatic guess.</p><div class="row"><div class="field"><label>Say it like</label><input name="pronunciationHint" value="${esc(g.pronunciation?.hint||"")}" placeholder="A phonetic cue you can read aloud"></div><div class="field"><label>Playback language</label><select name="pronunciationLanguage">${[["en-US","English (US)"],["en-GB","English (UK)"],["fr-FR","French"],["es-ES","Spanish"],["ar-MA","Arabic (Morocco)"]].map(([value,label])=>`<option value="${value}" ${(g.pronunciation?.language||"en-US")===value?"selected":""}>${label}</option>`).join("")}</select></div></div><div class="field"><label>Stress or pronunciation notes</label><input name="pronunciationNotes" value="${esc(g.pronunciation?.notes||"")}" placeholder="e.g. Stress the second syllable"></div></section><div class="row"><div class="field"><label>Instagram</label><input name="instagram" value="${esc(z.instagram||"")}"></div><div class="field"><label>TikTok</label><input name="tiktok" value="${esc(z.tiktok||"")}"></div></div><div class="row"><div class="field"><label>YouTube</label><input name="youtube" value="${esc(z.youtube||"")}"></div><div class="field"><label>Website</label><input name="website" value="${esc(z.website||"")}"></div></div><div class="field"><div class="sectionhead"><h3>Projects & credits</h3><button type="button" class="btn secondary small" onclick="addGuestProjectRow()">＋ Add project</button></div><div class="smalltext">These credits belong to the guest profile and will be available across all their interviews.</div><div id="guestprojectlist" class="project-editor-list">${(g.projects||[]).map((p,i)=>projectRow(p,i)).join("")}</div></div><div class="field"><label>Private notes</label><textarea name="notes">${esc(g.notes||"")}</textarea></div><button class="btn blue">Save guest</button></form>${g.id?guestJournalPreview(g):""}`}

function guestTimelineItems(g){
 const items=[];
 for(const e of guestEpisodes(g)){const c=conv(e.conventionId);items.push({date:c?.startDate||e.date||"",type:"episode",title:"Episode: "+(c?.name||"Unassigned convention"),details:(e.guestStatus||"Invited")+" · "+(STATUSES[e.status]?.[1]||"In progress"),id:e.id})}
 for(const c of db.conventions){if((c.guestIds||[]).includes(g.id))items.push({date:c.startDate||"",type:"convention",title:"Convention lineup: "+c.name,details:"Listed as a convention guest",id:c.id})}
 for(const e of g.relationshipEvents||[])items.push({date:e.date||"",type:"manual",title:e.kind||"Personal note",details:e.text||"",id:e.id});
 return items.sort((a,b)=>String(b.date).localeCompare(String(a.date))||a.title.localeCompare(b.title));
}

function openGuestJournal(id,tab="history"){

 const timeline=guestTimelineItems(g),memories=(g.conversationMemories||[]).slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));

 ?`<div class="vault-journal-toolbar"><p class="smalltext">Linked interviews and convention listings appear automatically. Add your own meetings and contact history.</p><button class="btn blue small" onclick="editGuestJournalEntry('${esc(id)}','history')">＋ Add interaction</button></div><div class="vault-journal-list">${timeline.map(x=>`<article class="vault-journal-item"><div class="vault-journal-meta"><span class="tag">${esc(x.type==="manual"?"Personal":x.type==="episode"?"Interview":"Convention")}</span><small>${esc(x.date||"Undated")}</small></div><strong>${esc(x.title)}</strong><p>${esc(x.details)}</p>${x.type==="manual"?`<div class="vault-journal-actions"><button class="btn secondary small" onclick="editGuestJournalEntry('${esc(id)}','history','${esc(x.id)}')">Edit</button><button class="btn danger small" onclick="deleteGuestJournalEntry('${esc(id)}','history','${esc(x.id)}')">Delete</button></div>`:x.type==="episode"?`<button class="btn secondary small" onclick="openEpisode('${esc(x.id)}')">Open episode</button>`:""}</article>`).join("")||'<div class="production-empty">No history recorded yet.</div>'}</div>`
 :`<div class="vault-journal-toolbar"><p class="smalltext">Keep memorable stories, answers and useful details for a future interview. Notes belong to this guest across episodes.</p><button class="btn blue small" onclick="editGuestJournalEntry('${esc(id)}','memory')">＋ Add memory</button></div><div class="vault-journal-list">${memories.map(x=>`<article class="vault-journal-item"><div class="vault-journal-meta"><span class="tag">${esc(x.topic||"Conversation")}</span><small>${esc(x.date||"Undated")}</small></div><p>${esc(x.text)}</p>${x.episodeId?`<small class="vault-muted">From ${esc(epTitle(db.episodes.find(e=>e.id===x.episodeId)||{guest:g.name}))}</small>`:""}<div class="vault-journal-actions"><button class="btn secondary small" onclick="editGuestJournalEntry('${esc(id)}','memory','${esc(x.id)}')">Edit</button><button class="btn danger small" onclick="deleteGuestJournalEntry('${esc(id)}','memory','${esc(x.id)}')">Delete</button></div></article>`).join("")||'<div class="production-empty">No conversation memories yet.</div>'}</div>`;
 showModal("✦ "+g.name+" · Guest journal",tabs+body+`<div class="production-footer"><button class="btn secondary" onclick="editGuest('${esc(id)}')">← Back to guest profile</button><button class="btn secondary" onclick="closeModal()">Done</button></div>`);
}

function editGuestJournalEntry(id,tab,entryId=""){
 const g=db.guests.find(x=>x.id===id);if(!g)return;
 const list=tab==="history"?(g.relationshipEvents||[]):(g.conversationMemories||[]);
 const entry=list.find(x=>x.id===entryId)||{};
 const isHistory=tab==="history";
 showModal((entry.id?"Edit ":"Add ")+(isHistory?"relationship note":"conversation memory"),`<form id="vaultJournalForm"><div class="row"><div class="field"><label>Date</label><input name="date" type="date" value="${esc(entry.date||new Date().toISOString().slice(0,10))}"></div><div class="field"><label>${isHistory?"Interaction type":"Topic"}</label>${isHistory?`<select name="kind">${["Meeting","Convention","Interview","Message","Follow-up","Other"].map(t=>`<option value="${t}" ${entry.kind===t?"selected":""}>${t}</option>`).join("")}</select>`:`<input name="topic" maxlength="80" value="${esc(entry.topic||"")}" placeholder="e.g. First audition">`}</div></div>${!isHistory?`<div class="field"><label>Related episode (optional)</label><select name="episodeId"><option value="">General memory</option>${guestEpisodes(g).map(e=>`<option value="${esc(e.id)}" ${entry.episodeId===e.id?"selected":""}>${esc(epTitle(e))}</option>`).join("")}</select></div>`:""}<div class="field"><label>${isHistory?"What happened?":"What did the guest share?"}</label><textarea name="text" rows="5" maxlength="6000" required>${esc(entry.text||"")}</textarea></div><div class="production-footer"><button class="btn blue" type="submit">Save ${isHistory?"interaction":"memory"}</button><button type="button" class="btn secondary" onclick="openGuestJournal('${esc(id)}','${tab}')">Cancel</button></div></form>`);
 document.getElementById("vaultJournalForm").onsubmit=event=>{
  event.preventDefault();const form=new FormData(event.target),text=String(form.get("text")||"").trim();if(!text)return;
  const target=isHistory?(g.relationshipEvents=Array.isArray(g.relationshipEvents)?g.relationshipEvents:[]):(g.conversationMemories=Array.isArray(g.conversationMemories)?g.conversationMemories:[]);
  const existing=target.findIndex(x=>x.id===entryId),payload={id:entry.id||uid(),date:String(form.get("date")||""),text,...(isHistory?{kind:String(form.get("kind")||"Other")}:{topic:String(form.get("topic")||"").trim(),episodeId:String(form.get("episodeId")||"")})};
  if(existing>=0)target[existing]=payload;else target.push(payload);
  save();openGuestJournal(id,tab);
 };
}

function deleteGuestJournalEntry(id,tab,entryId){

 const key=tab==="history"?"relationshipEvents":"conversationMemories";
 g[key]=(g[key]||[]).filter(x=>x.id!==entryId);save();openGuestJournal(id,tab);

function episodeRightsBadge(e){

function guestNameSimilarity(a,b){
 const clean=s=>normalizeGuestName(s).replace(/[^a-z0-9 ]/g,"").trim();
 a=clean(a);b=clean(b);if(!a||!b)return 0;if(a===b)return 1;
 const A=a.split(/\s+/),B=b.split(/\s+/),common=A.filter(x=>B.includes(x)).length;
 const token=common/Math.max(A.length,B.length);
 const lev=(x,y)=>{let row=Array.from({length:y.length+1},(_,i)=>i);for(let i=1;i<=x.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=y.length;j++){let t=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(x[i-1]===y[j-1]?0:1));prev=t}}return row[y.length]};
 const edit=1-lev(a,b)/Math.max(a.length,b.length);return Math.max(token,edit);
}
function possibleGuestDuplicates(name,excludeId=""){
 return db.guests.filter(g=>g.id!==excludeId&&guestNameSimilarity(g.name,name)>=.78).sort((a,b)=>guestNameSimilarity(b.name,name)-guestNameSimilarity(a.name,name));
}

async function loadFilmographyCredits(actorId){
 if(!/^Q[1-9]\d{0,11}$/.test(actorId))return;
 const host=document.getElementById("wikidataResults");if(!host)return;host.textContent="Loading film and TV credits from Wikidata…";
 const query=`SELECT DISTINCT ?work ?workLabel ?releaseDate ?characterLabel WHERE {
  ?work wdt:P161 wd:${actorId} .
  OPTIONAL { ?work wdt:P577 ?releaseDate . }
  OPTIONAL { ?work p:P161 ?statement . ?statement ps:P161 wd:${actorId} . ?statement pq:P453 ?character . }
  SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
 } LIMIT 90`;
 try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),22000);
  let res;try{res=await fetch('https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(query),{signal:controller.signal,headers:{Accept:'application/sparql-results+json'}})}finally{clearTimeout(timeout)}
  if(!res.ok)throw Error("Wikidata query unavailable ("+res.status+")");
  const bindings=(await res.json()).results?.bindings||[];
  const records=new Map();for(const b of bindings){const uri=b.work?.value||'',id=uri.match(/\/(Q\d+)$/)?.[1],title=b.workLabel?.value||'';if(!id||!title||title===id)continue;
   const existing=records.get(id)||{id,title,type:"Other",characterName:"",year:"",sourceUrl:'https://www.wikidata.org/wiki/'+id};
   if(!existing.characterName&&b.characterLabel?.value&&!/^Q\d+$/.test(b.characterLabel.value))existing.characterName=b.characterLabel.value;
   if(!existing.year&&b.releaseDate?.value)existing.year=String(b.releaseDate.value).slice(0,4);
   records.set(id,existing);
  }
  vaultResearchCredits=[...records.values()].sort((a,b)=>(b.year||'').localeCompare(a.year||'')||a.title.localeCompare(b.title));
  host.innerHTML=vaultResearchCredits.length?`<div class="sectionhead"><div><h3>Public credits · ${vaultResearchCredits.length}</h3><p class="smalltext">Check each title against the source. Import selected credits into this guest's profile.</p></div><button class="btn blue small" onclick="importFilmographyCredits()">Import checked</button></div><div class="research-credit-list">${vaultResearchCredits.map((x,i)=>`<label class="research-credit"><input type="checkbox" data-research-index="${i}" ${i<12?'checked':''}><span><b>${esc(x.title)}</b><small>${esc([x.year,x.characterName].filter(Boolean).join(' · ')||'Year and character not listed')}</small></span><a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Source ↗</a></label>`).join('')}</div>`:'<p class="smalltext">No film/TV cast credits found for this person on Wikidata. You can still manually add projects to the guest profile.</p>';
 }catch(err){host.innerHTML=`<p class="smalltext">Couldn't load credits: ${esc(err.name==='AbortError'?'The query timed out. Try again later.':err.message)}. Wikidata is a public service and may be slow. Your saved projects are unaffected.</p>`}
}

let vaultCrossQuestions=[];
function crossProjectQuestionIdeas(projects,angle="both"){
 const chosen=projects.filter(p=>p&&p.title);
 if(chosen.length<2)return [];
 const names=chosen.map(p=>p.title),roles=chosen.filter(p=>String(p.characterName||"").trim());
 const joinNames=arr=>arr.length===2?arr.join(" and "):arr.slice(0,-1).join(", ")+", and "+arr[arr.length-1];
 const titleList=joinNames(names);
 const prompts=[];
 if(angle!=="characters"){
  prompts.push(
   `Looking across ${titleList}, which project pushed you furthest outside your comfort zone, and why?`,
   `What creative instinct did you carry from one of these projects into another?`,
   `If you could revisit one decision from any of these projects today, which would you change?`,
   `Which of these productions surprised you most once you were actually working on it?`,
   `What connects your experiences on ${titleList} that viewers might never expect?`,
   `If you could borrow one thing from the creative process of each of these projects, what would your ideal production look like?`
  );
  for(let i=0;i<chosen.length;i++)for(let j=i+1;j<chosen.length&&prompts.length<22;j++){
   const a=chosen[i],b=chosen[j];
   prompts.push(`Between ${a.title} and ${b.title}, what changed most in how you approached your work?`);
   prompts.push(`What lesson from ${a.title} would have helped you most while making ${b.title}?`);
  }
 }
 if(angle!=="projects"){
  if(roles.length>=2){
   const roleList=joinNames(roles.map(p=>p.characterName+" ("+p.title+")"));
   prompts.push(
    `Looking at ${roleList}, which character challenged your instincts the most?`,
    `If these characters met, who would surprise the others the most, and why?`,
    `Which of these characters would be the most difficult for you to play again today?`,
    `What personality trait connects these characters despite their different worlds?`,
    `Which character taught you something that changed the way you played another?`,
    `If you could exchange one quality between two of these characters, what would you swap?`
   );
   for(let i=0;i<roles.length;i++)for(let j=i+1;j<roles.length&&prompts.length<40;j++){
    const a=roles[i],b=roles[j];
    prompts.push(`How did playing ${a.characterName} in ${a.title} differ from playing ${b.characterName} in ${b.title}?`);
    prompts.push(`If ${a.characterName} and ${b.characterName} had to solve a problem together, where would they clash first?`);
   }
  }else{
   prompts.push('Add character names to at least two selected guest projects to generate character-specific comparisons.');
  }
 }
 return [...new Set(prompts)].slice(0,40);
}

function filmographyQuestionIdeas(project,guestName){
 const title=String(project.title||"the project").trim(),character=String(project.characterName||"").trim(),type=String(project.type||"project").toLowerCase();
 const base=[
  `What part of ${title} do you think audiences might understand differently after hearing your perspective on making it?`,
  `Was there a choice you made while working on ${title} that changed how you understood your character?`,
  `If you could revisit one scene from ${title} with everything you know now, which moment would you choose and why?`,
  `What did working on ${title} teach you about your own instincts as a performer?`,
  `Which detail from the making of ${title} would surprise someone who has only watched it?`,
  `If ${title} had an unofficial behind-the-scenes chapter, what would its title be?`,
  `What question about ${title} do you wish interviewers would ask you more often?`,
  `Was there a moment on ${title} when the story took an unexpected turn for you personally?`
 ];
 if(character)base.push(
  `What did you decide about ${character} that was never explicitly written in the script?`,
  `What would ${character} be surprisingly good at outside the world of ${title}?`,
  `Which part of ${character}'s personality was the most fun to explore, and which was the hardest to get right?`
 );
 if(type.includes("tv"))base.push(
  `How did your understanding of ${character||"the character"} evolve as ${title} continued?`,
  `Was there a storyline you secretly hoped ${title} would explore further?`
 );
 if(type.includes("film"))base.push(
  `What did the pace of making a film like ${title} allow you to explore that television might not?`
 );
 return [...new Set(base)];
}

function addFilmographyQuestion(episodeId,question){
 const episode=db.episodes.find(e=>String(e.id)===String(episodeId));if(!episode)return;
 episode.questions=Array.isArray(episode.questions)?episode.questions:[];

function closestInterviewConventionId(){
 const conventions=db.conventions||[];if(!conventions.length)return "";
 const today=new Date();today.setHours(0,0,0,0);const now=today.getTime();
 const dateValue=v=>{if(!v)return NaN;const d=new Date(String(v).slice(0,10)+"T00:00:00");return d.getTime()};
 return conventions.slice().sort((a,b)=>{
  const score=c=>{const start=dateValue(c.startDate),end=dateValue(c.endDate)||start;
   if(!Number.isFinite(start))return [Infinity,2];
   const lo=Math.min(start,Number.isFinite(end)?end:start),hi=Math.max(start,Number.isFinite(end)?end:start);
   return [now<lo?lo-now:now>hi?now-hi:0,hi<now?1:0];};
  const x=score(a),y=score(b);return x[0]-y[0]||x[1]-y[1]||String(a.name||"").localeCompare(String(b.name||""));
 })[0].id;
}

k="resetInterviewTimer('${e.id}')">↺ Reset</button></div></section>${(()=>{const photo=guest?.photo&&safeGuestUrl(guest.photo);return `<div class="interview-guest-photo">${photo?`<img src="${esc(photo)}" alt="${esc(guest?.name||e.guest||'Guest')}" style="object-position:${Number(guest.photoX??50)}% ${Number(guest.photoY??50)}%;transform:scale(${Number(guest.photoZoom??1)});transform-origin:${Number(guest.photoX??50)}% ${Number(guest.photoY??50)}%">`:`<span>${esc(String(e.guest||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()||"✦")}</span>`}</div>`})()}</div><div class="question-library-workspace"><div class="sectionhead"><h3>Question library</h3><div class="question-library-actions"><button class="btn secondary small" onclick="openInterviewShortlist('${e.id}')">☆ Shortlist <span id="questionShortlistCount">${(e.questionShortlist||[]).length}</span></button><button class="btn secondary small" onclick="openFavoriteQuestions('${e.id}')">★ Saved questions</button></div></div>${guest?`<div class="filmography-research-bar"><button class="btn secondary small" onclick="openFilmographyResearch('${guest.id}')">🔎 Research filmography</button>${(guest.projects||[]).length>1?`<button class="btn secondary small" onclick="openCrossProjectQuestions('${e.id}','${guest.id}')">↔ Cross-project questions</button>`:''}</div>`:''}${(guest?.projects||[]).filter(p=>p.title&&p.title.trim()).length?`<div class="project-strip-heading"><div class="project-strip-label">Guest projects <span class="project-count">${guest.projects.filter(p=>p.title&&p.title.trim()).length}</span></div>${guest.projects.filter(p=>p.title&&p.title.trim()).length>2?`<button type="button" class="btn secondary small project-expand-toggle" aria-expanded="false" onclick="toggleInterviewProjects(this)">Show all ${guest.projects.filter(p=>p.title&&p.title.trim()).length} projects ↓</button>`:""}</div><div class="project-strip interview-project-strip">${guest.projects.filter(p=>p.title&&p.title.tri function toggleInterviewProjects(button){
 const strip=button.closest(".project-strip-heading")?.nextElementSibling;
 if(!strip||!strip.classList.contains("interview-project-strip"))return;
 const expanded=strip.classList.toggle("expanded");button.setAttribute("aria-expanded",String(expanded));
 const count=strip.querySelectorAll(".project-chip").length;
 button.textContent=expanded?"Show fewer ↑":"Show all "+count+" projects ↓";
}
function vaultGameTemplates(type,guest){
 const projects=(guest?.projects||[]).filter(p=>p.title);
 if(type==="this-or-that")return ["Rehearsals or improvisation?","Early call times or late night shoots?","Hero or villain?","Comedy or drama?","Auditions or first day on set?","Play yourself or someone completely different?"];
 if(type==="would-you-rather")return ["Would you rather instantly memorize any script or never forget a face?","Would you rather play a detective or an undercover spy?","Would you rather direct one episode or write one episode?","Would you rather improvise an entire scene or learn a ten-page monologue?","Would you rather revisit your first role or jump ahead to a role ten years from now?"];
 if(type==="rank")return ["Rank these from most to least nerve-racking: audition, first read-through, first day on set.","Rank these from most to least useful: rehearsal time, a great scene partner, a surprising script.","Rank these by your personal preference: comedy, drama, mystery."];
 if(type==="character")return projects.length?projects.slice(0,6).map(p=>`Describe your character${p.characterName?" "+p.characterName:""} from ${p.title} in three words, without explaining why until afterward.`):["Describe a character you've played in three words and let me guess who it is.","Choose a past character and describe their ideal vacation without naming them."];
 return ["Your custom game prompt goes here."];
}

function openInterviewGames(episodeId){
 const e=db.episodes.find(x=>x.id===episodeId);if(!e)return;
 const games=e.interviewGames||[];
 const types=[["this-or-that","This or That"],["would-you-rather","Would You Rather"],["rank","Rank These"],["character","Character Challenge"]];

}

function editInterviewGame(episodeId,gameId="",templateType="this-or-that"){
 const e=db.episodes.find(x=>x.id===episodeId);if(!e)return;
 const g=(e.interviewGames||[]).find(x=>x.id===gameId),guest=db.guests.find(x=>x.id===e.guestId);
 const type=g?.type||templateType,types=[["this-or-that","This or That"],["would-you-rather","Would You Rather"],["rank","Rank These"],["character","Character Challenge"],["custom","Custom Game"]];
 const title=g?.title||types.find(x=>x[0]===type)?.[1]||"Custom Game",prompts=g?.prompts||vaultGameTemplates(type,guest);
 showModal(g?"Edit interview game":"New interview game",`<form id="vaultGameForm"><div class="field"><label>Game name</label><input name="title" maxlength="100" required value="${esc(title)}"></div><div class="field"><label>Format</label><select name="type" id="vaultGameType">${types.map(([value,label])=>`<option value="${value}" ${value===type?"selected":""}>${label}</option>`).join("")}</select></div><div class="field"><label>Prompts (one per line)</label><textarea name="prompts" id="vaultGamePrompts" rows="9" required>${esc(prompts.join("\n"))}</textarea><button type="button" class="btn secondary small" onclick="refillInterviewGamePrompts('${esc(episodeId)}')">↻ Load example prompts</button><p class="smalltext">You can freely rewrite these prompts. Loading examples replaces the current text after confirmation.</p></div><div class="production-footer"><button class="btn blue" type="submit">Save game</button><button class="btn secondary" type="button" onclick="openInterviewGames('${esc(episodeId)}')">Cancel</button></div></form>`);
 document.getElementById("vaultGameForm").onsubmit=ev=>{
  ev.preventDefault();const f=new FormData(ev.target),title=String(f.get("title")||"").trim(),entries=String(f.get("prompts")||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!title||!entries.length){alert("Add a name and at least one game prompt.");return}
  e.interviewGames=Array.isArray(e.interviewGames)?e.interviewGames:[];
  const index=e.interviewGames.findIndex(x=>x.id===gameId);
  const item={id:g?.id||uid(),title,type:String(f.get("type")||"custom"),prompts:entries,lastPlayedAt:g?.lastPlayedAt||""};
  if(index>=0)e.interviewGames[index]=item;else e.interviewGames.push(item);
  save();openInterviewGames(episodeId);
 };
}

function refillInterviewGamePrompts(episodeId){
 const e=db.episodes.find(x=>x.id===episodeId),type=document.getElementById("vaultGameType")?.value,textarea=document.getElementById("vaultGamePrompts");if(!e||!type||!textarea)return;
 if(textarea.value.trim()&&!confirm("Replace the current prompts with starter examples?"))return;
 textarea.value=vaultGameTemplates(type,db.guests.find(g=>g.id===e.guestId)).join("\n");
}

function deleteInterviewGame(episodeId,gameId){
 const e=db.episodes.find(x=>x.id===episodeId);if(!e||!confirm("Delete this game and its prompts?"))return;
 e.interviewGames=(e.interviewGames||[]).filter(g=>g.id!==gameId);save();openInterviewGames(episodeId);
}

function playInterviewGame(episodeId,gameId){
 const e=db.episodes.find(x=>x.id===episodeId),g=(e?.interviewGames||[]).find(x=>x.id===gameId);if(!g||(g.prompts||[]).length===0)return;
 vaultPlayingGame={episodeId,gameId,index:0};paintInterviewGame();
}

function stepInterviewGame(step){
 if(!vaultPlayingGame)return;
 const e=db.episodes.find(x=>x.id===vaultPlayingGame.episodeId),g=(e?.interviewGames||[]).find(x=>x.id===vaultPlayingGame.gameId);if(!g)return;
 vaultPlayingGame.index=Math.max(0,Math.min(g.prompts.length-1,vaultPlayingGame.index+step));paintInterviewGame();
}

function paintInterviewGame(){
 if(!vaultPlayingGame)return;
 const {episodeId,gameId,index}=vaultPlayingGame,e=db.episodes.find(x=>x.id===episodeId),g=(e?.interviewGames||[]).find(x=>x.id===gameId);if(!g)return;

function interviewDurationMinutes(value){
 if(value===null||value===undefined||String(value).trim()==="")return 15;
 const raw=String(value).trim();
 const numeric=Number(raw);
 if(Number.isFinite(numeric)&&numeric>0)return Math.round(numeric);
 const match=raw.match(/(\\d+(?:\\.\\d+)?)/);
 if(match){const n=Number(match[1]);if(Number.isFinite(n)&&n>0)return Math.round(n)}
 return 15;
}
function addMinutesToTime(time,minutes){
 if(!time||!/^\d{2}:\d{2}$/.test(time))return "";
 const [h,m]=time.split(":").map(Number),total=h*60+m+minutes;
 return `${String(Math.floor((total%(24*60))/60)).padStart(2,"0")}:${String(total%60).padStart(2,"0")}`;
}
function conventionDateGroups(){
 const today=localISODate(new Date());
 const isDate=d=>typeof d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(new Date(d+"T12:00:00").getTime());
 const upcoming=[],past=[],undated=[];
 (db.conventions||[]).forEach(c=>{
  if(!isDate(c.startDate)){undated.push(c);return}
  const end=isDate(c.endDate)&&c.endDate>=c.startDate?c.endDate:c.startDate;
  if(end>=today)upcoming.push(c);else past.push(c);
 });
 upcoming.sort((a,b)=>{
  const as=a.startDate<=today,bs=b.startDate<=today;
  if(as!==bs)return as?-1:1;
  return as?((a.endDate||a.startDate).localeCompare(b.endDate||b.startDate)||a.startDate.localeCompare(b.startDate)):(a.startDate.localeCompare(b.startDate)||a.name.localeCompare(b.name));
 });
 past.sort((a,b)=>(b.endDate||b.startDate).localeCompare(a.endDate||a.startDate));
 undated.sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));
 return {upcoming,past,undated};
}

function plannerCalendar(c){
 if(!c)return "";
 let start=new Date((c.startDate||new Date().toISOString().slice(0,10))+"T12:00:00"),end=new Date((c.endDate||c.startDate||new Date().toISOString().slice(0,10))+"T12:00:00");
 let weekends=[],cursor=new Date(start);while(cursor.getDay()!==6)cursor.setDate(cursor.getDate()+1);
 for(;cursor<=end;cursor.setDate(cursor.getDate()+7)){let sat=new Date(cursor),sun=new Date(cursor);sun.setDate(sun.getDate()+1);weekends.push([new Date(sat),sun<=end?sun:null])}
 if(!weekends.length){let sat=new Date(start);sat.setDate(sat.getDate()-(sat.getDay()+1)%7);let sun=new Date(sat);sun.setDate(sun.getDate()+1);weekends=[[sat,sun]]}
 let idx=Math.max(0,Math.min(weekends.length-1,Number(window.plannerWeekIndex)||0));window.plannerWeekIndex=idx;
 let [sat,sun]=weekends[idx],key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
 let events=[...(c.events||[]),...(c.panels||[]).map(x=>({title:x.title,date:x.date||plannerDate(c,x.day),time:x.time,kind:"Panel"})),...db.episodes.filter(e=>e.conventionId===c.id&&e.time).map(e=>({title:"Interview: "+e.guest,date:e.interviewDate||plannerDate(c,e.interviewDay),time:e.time,kind:"Interview"}))];
 let card=d=>{if(!d)return `<div class="week-day-card muted-day"><b>Sunday</b><span class="smalltext">Outside convention dates</span></div>`;let items=events.filter(e=>e.date===key(d)).sort((x,y)=>(x.time||"").localeCompare(y.time||""));return `<div class="week-day-card"><div class="week-day-heading"><b>${d.toLocaleDateString(undefined,{weekday:"long"})}</b><strong>${d.toLocaleDateString(undefined,{day:"numeric",month:"short"})}</strong></div>${items.map(e=>`<div class="week-event"><b>${esc(e.time||"Time TBC")}</b><span>${esc(e.title||e.kind||"Activity")}</span><small>${esc(e.kind||"Activity")}</small></div>`).join("")||'<div class="smalltext week-empty">No events scheduled</div>'}</div>`};
 return `<div class="week-nav"><button class="btn secondary small" ${idx===0?"disabled":""} onclick="window.plannerWeekIndex=${idx-1};render()">‹ Previous weekend</button><b>Weekend ${idx+1} of ${weekends.length}</b><button class="btn secondary small" ${idx===weekends.length-1?"disabled":""} onclick="window.plannerWeekIndex=${idx+1};render()">Next weekend ›</button></div><div class="week-calendar">${card(sat)}${card(sun)}</div>`;
}
const VAULT_FLIGHT_WORKER_URL="https://the-vault-flight-api.saadsaoulajane.workers.dev";

function conventionFlights(c){

 <div class="flight-live" id="flightStatus-${key}"><span class="flight-status-dot"></span><span>${f.liveStatus?renderFlightStatus(f.liveStatus):"Live status has not been checked yet."}</span></div>
 <div class="row flight-actions"><a class="btn secondary small" href="${google}" target="_blank" rel="noopener">Google Flights ↗</a><button class="btn blue small" ${(!flight||!date)?"disabled":""} onclick="refreshFlightStatus('${c.id}','${key}')">↻ Check live status</button></div>
 </div>`}).join("")}
 <p class="smalltext">Status is checked only when you tap the button. Your Aviationstack key stays on Cloudflare and is never sent to this app.</p>
 </section>`;
}
function renderFlightStatus(s){
 if(!s)return "Live status has not been checked yet.";
 let status=s.flight_status||"Status unavailable",dep=s.departure||{},arr=s.arrival||{};
 let detail=[dep.gate?"Gate "+dep.gate:"",dep.terminal?"Terminal "+dep.terminal:"",arr.gate?"Arrival gate "+arr.gate:"",dep.delay!=null&&dep.delay!==0?"Departure delay "+dep.delay+" min":""].filter(Boolean).join(" · ");
 return `<span class="flight-status-pill" data-status="${esc(status.toLowerCase())}">${esc(status)}</span><span class="smalltext">${esc(detail||"Latest provider update")}</span>${dep.estimated?`<small>Est. departure: ${esc(dep.estimated)}</small>`:""}${arr.estimated?`<small>Est. arrival: ${esc(arr.estimated)}</small>`:""}`;
}
async function refreshFlightStatus(conventionId,leg){
 let c=db.conventions.find(x=>x.id===conventionId),f=c?.flights?.[leg];
 if(!f?.flightNumber||!f.date)return;
 let target=document.getElementById("flightStatus-"+leg);
 if(!navigator.onLine){if(target)target.innerHTML='<span class="flight-status-dot offline"></span><span>You are offline. Connect to the internet and try again.</span>';return}
 if(target)target.textContent="Checking live flight status…";
 try{
  let url=VAULT_FLIGHT_WORKER_URL+"?"+new URLSearchParams({flight_iata:f.flightNumber.trim().toUpperCase(),flight_date:f.date});
  let response=await fetch(url,{method:"GET",headers:{Accept:"application/json"}});
  let result=await response.json();
  if(!response.ok)throw new Error(result.error||"Flight status service returned an error.");
  let found=(result.data||[])[0];
  if(!found)throw new Error("No matching flight was found. Check the flight number and date.");
  f.liveStatus=found;f.liveStatusCheckedAt=new Date().toISOString();save();
  if(target)target.innerHTML=renderFlightStatus(found);
 }catch(err){
  if(target)target.innerHTML='<span class="flight-status-dot offline"></span><span>'+esc(err.message||"Live status unavailable")+'</span>';
 }
}

function uploadVenuePlans(venueId){

function compressPlanImage(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=()=>reject(Error("File could not be read"));reader.onload=()=>{let img=new Image();img.onerror=()=>reject(Error("Image could not be opened"));img.onload=()=>{let scale=Math.min(1,1800/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.82))};img.src=reader.result};reader.readAsDataURL(file)})}
async function pdfToPlanImages(file){
 if(!window.pdfjsLib){await new Promise((resolve,reject)=>{let s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=resolve;s.onerror=()=>reject(Error("PDF viewer could not load. Connect to the internet and try again."));document.head.appendChild(s)});window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}
 let bytes=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:bytes}).promise,pages=[];
 for(let n=1;n<=Math.min(pdf.numPages,12);n++){let page=await pdf.getPage(n),viewport=page.getViewport({scale:Math.min(1.7,1800/page.getViewport({scale:1}).width)}),canvas=document.createElement("canvas");canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;pages.push(canvas.toDataURL("image/jpeg",.84))}

}
