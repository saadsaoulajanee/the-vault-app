.app{max-width:1250px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:21px;letter-spacing:-.5px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--pink));display:grid;place-items:center;color:white;font-size:22px;box-shadow:0 7px 18px #6b74d433}.topright{display:flex;gap:9px;align-items:center}.pill{border-radius:999px;background:#fff;border:1px solid var(--line);padding:8px 12px;color:var(--muted);font-size:12px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.nav button{padding:10px 15px;border-radius:12px;color:#677087;background:transparent;font-weight:700}.nav button.active{background:var(--ink);color:#fff}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:8px 0 22px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:800;color:var(--blue)}h1{font-size:clamp(26px,4vw,36px);letter-spacing:-1.1px;margin:5px 0}h2{font-size:20px;margin:0 0 14px;letter-spacing:-.4px}h3{font-size:16px;margin:0 0 8px}.sub{color:var(--muted);margin:0}.btn{padding:10px 14px;border-radius:11px;background:var(--ink);color:#fff;font-weight:750}.btn.secondary{background:#eef1f8;color:var(--ink)}.btn.blue{background:var(--blue)}.btn.pink{background:var(--pink)}.btn.danger{background:#fff0f0;color:#bd3d51}.btn.small{padding:7px 10px;font-size:13px}.btn:disabled{opacity:.35;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.stat{grid-column:span 3}.stat strong{display:block;font-size:30px;letter-spacing:-1px;margin:7px 0}.stat span{color:var(--muted);font-size:13px}.wide{grid-column:span 8}.side{grid-column:span 4}.full{grid-column:1/-1}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.stack{display:grid;gap:10px}.episode{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;transition:.15s;background:#fff}.episode:hover{border-color:#b7c5ff;transform:translateY(-1px)}.epicon{width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,#eaf0ff,#fff0f7);display:grid;place-items:center;font-size:21px;flex:none}.epbody{min-width:0;flex:1}.epbody b{display:block;overflow-wrap:anywhere}.epmeta{font-size:12px;color:var(--muted);margin-top:3px}.epactions{display:flex;gap:6px;align-items:center}.status{font-size:12px;border-radius:99px;background:#f1f3f8;padding:5px 9px;white-space:nowrap}.status.published{background:#e7f8f1;color:#127a5f}.status.cancelled{background:#fff0f0;color:#b34250}.bar{height:7px;background:#edf0f6;border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pink));border-radius:99px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:800;color:#68718a}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe4ee;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink)}textarea{min-height:130px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.muted{color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #d7ddea;border-radius:14px}.qrow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.qrow:last-child{border:0}.qrow input{margin-top:5px;accent-color:var(--blue);width:18px;height:18px;flex:none}.qtext{flex:1}.qtext.done{color:#8b93a4;text-decoration:line-through}.qtools{display:flex;gap:5px}.smalltext{font-size:12px;color:var(--muted)}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tag{display:inline-flex;background:var(--softblue);color:#4c6 /* V0.4.4: keep episode cards compact while allowing their questions to scroll */
.episode-questions,
.question-list,
.questions-list,
.episode-card .questions,
.episode-card .question-list {
  max-height: 320px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-right: 6px;
}



/* V0.4.5: fix the actual editor question container and interview spacing */
#epform #editquestions {
  max-height: min(42vh, 360px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 0 8px 0 0;
  scrollbar-gutter: stable;
}
#epform #editquestions .qrow { padding: 9px 0; }
#epform #editquestions .qrow input[aria-label="Question"] {
  min-width: 0;
  max-width: 100%;
}
.hero:has(.interview-select) {
  align-items: flex-start;
  justify-content: flex-start;
  flex-direction: column;
  gap: 12px;
  margin: 8px 0 16px;
}
.hero:has(.interview-select) > div:first-child { width: 100%; }
.hero .interview-select {
  width: min(100%, 440px);
  min-width: 0;
  flex: none;
  align-self: flex-start;
  margin: 0;
}



/* V0.4.6: remove the oversized interview hero gap on narrow screens */
.hero:has(.interview-select) {
  display: flex !important;
  height: auto !important;
  min-height: 0 !important;
  max-height: none !important;
  padding-bottom: 0 !important;
  margin: 8px 0 12px !important;
  align-content: flex-start !important;
  justify-content: flex-start !important;
  gap: 12px !important;
}
.hero:has(.interview-select) > div {
  flex: 0 0 auto !important;
}
.hero:has(.interview-select) + .card {
  margin-top: 0 !important;
}



/* V0.4.7: Vault-styled episode picker instead of Android's native select popup */
.episode-picker-trigger {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  width:100%; min-width:0; min-height:46px; padding:10px 14px;
  border:1px solid var(--line); border-radius:14px; background:#fff;
  color:var(--ink); font:inherit; font-weight:700; text-align:left;
  box-shadow:0 1px 2px rgba(20,30,50,.03); cursor:pointer;
}
.episode-picker-trigger span { flex:0 0 auto; color:var(--muted); font-size:20px; }
.episode-picker-list { display:grid; gap:8px; max-height:60vh; overflow-y:auto; }
.episode-picker-option {
  display:block; width:100%; padding:13px 14px; border:1px solid var(--line);
  border-radius:12px; background:#fff; color:var(--ink); text-align:left;
  font:inherit; font-weight:650; cursor:pointer;
}
.episode-picker-option.selected { border-color:var(--blue); background:var(--softblue); }


/* V0.4.9: consistent Vault-style custom pickers for every native select */
.vault-select-wrap{position:relative;min-width:0;flex:1}
.vault-select-wrap>select{position:absolute!important;inset:0!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}
.vault-select-button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-width:0;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.vault-select-button .vault-select-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vault-select-button .vault-select-chevron{flex:0 0 auto;color:var(--muted)}
.vault-picker-options{display:grid;gap:8px;max-height:60vh;overflow:auto}
.vault-picker-option{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.vault-picker-option.selected{border-color:var(--blue);background:var(--softblue);font-weight:700}

/* V0.5.0: guest project credits */
.project-editor-list{display:grid;gap:8px;margin:8px 0}
.project-editor-row{display:grid;grid-template-columns:minmax(0,1fr) 125px 38px;gap:8px;align-items:center}
.project-editor-row input,.project-editor-row select{min-width:0;width:100%}
.project-strip{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.project-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#f8f9fd;color:var(--muted);font-size:12px;line-height:1.3}
.project-chip strong{color:var(--ink);font-weight:650}
.project-strip-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
@media(max-width:480px){.project-editor-row{grid-template-columns:minmax(0,1fr) 105px 34px}}

/* V0.5.7: themed organizer picker overlay that preserves the convention form */
.organizer-picker-wrap{position:relative}
.organizer-picker-button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.organizer-picker-button:focus-visible{outline:3px solid #8ba2ff;outline-offset:2px}
.organizer-picker-overlay{position:fixed;inset:0;z-index:10050;display:flex;align-items:center;justify-content:center;padding:20px;background:#10182b88}
.organizer-picker-panel{width:min(480px,100%);max-height:75vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 24px 70px #10182b55}
.organizer-picker-title{font-size:18px;font-weight:800;margin:0 0 12px}
.organizer-picker-option{display:block;width:100%;padding:13px 14px;margin:6px 0;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-align:left;font:inherit}
.organizer-picker-option.selected{border-color:var(--blue);background:var(--softblue);font-weight:750}
.checklist-grid{display:grid;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.checkrow{display:flex;width:100%;box-sizing:border-box;align-items:center;gap:9px;font-weight:500}.checkrow input{accent-color:var(--blue)}.checklist-scroll{max-height:230px;overflow-y:auto;overflow-x:hidden;display:block;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.checkrow{display:grid!important;grid-template-columns:20px minmax(0,1fr)!important;justify-content:initial!important;align-items:center!important;width:100%!important;min-width:0!important;box-sizing:border-box;column-gap:10px;font-weight:500;padding:7px 2px;white-space:normal;overflow-wrap:anywhere}.checkrow input{accent-color:var(--blue);margin:0!important;display:block;width:20px;height:20px;justify-self:start}.checkrow span{display:block;min-width:0;width:100%;text-align:left;white-space:normal;overflow-wrap:anywhere;word-break:normal}
/* V1.2.1: keep the episode editor mounted while choosing a dropdown value */
.vault-select-overlay{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(16,24,43,.58)}
.vault-select-panel{width:min(460px,100%);max-height:min(78vh,680px);overflow:hidden;display:flex;flex-direction:column;background:var(--paper,#fff);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 70px rgba(10,20,40,.28)}
.vault-select-panel .modhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.vault-select-panel .modalbody{padding:14px;overflow-y:auto;overscroll-behavior:contain}
.vault-select-panel .vault-picker-options{max-height:60vh;overflow-y:auto}


/* V1.2.2 additions */
.episode-number{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--blue);background:var(--softblue);border-radius:7px;padding:3px 7px;margin-right:5px;vertical-align:2px}
.episode-cancelled{opacity:.78;border-style:dashed}
.number-cancelled{background:#fff0f0;color:#b42318;text-decoration:line-through}
.interview-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.interview-controls .field{min-width:0;margin:0}
.kpi-grid{margin-bottom:16px}
.kpi-sections{margin-bottom:16px}
.kpi-list{display:grid;gap:13px;margin-top:16px}
.kpi-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,1.2fr) 28px;gap:10px;align-items:center;margin:12px 0}
.kpi-label{min-width:0;overflow-wrap:anywhere;font-size:13px;font-weight:650}
.kpi-track{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.kpi-track i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.kpi-row>b{text-align:right;font-variant-numeric:tabular-nums}
.kpi-convention{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kpi-convention:last-child{border-bottom:0}
.kpi-convention>strong{font-size:22px}
@media(max-width:560px){.interview-controls{grid-template-columns:1fr}.kpi-row{grid-template-columns:minmax(0,1fr) 70px 24px}.kpi-sections{grid-template-columns:1fr}}


/* V1.3.0 CRM and command-centre styling */
.guest-grid,.convention-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:16px}
.guest-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}.guest-head img,.guest-avatar{width:58px;height:58px;flex:none;border-radius:16px;object-fit:cover;background:linear-gradient(135deg,#eaf0ff,#fff0f7);display:grid;place-items:center;font-size:24px}
.guest-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.kanban-lane.drop-target{outline:2px dashed var(--blue);outline-offset:2px;background:#e6ebff}
.kanban-lane .episode[draggable="true"]{cursor:grab;user-select:none}.kanban-lane .episode.dragging,.kanban-lane .episode.touch-dragging{opacity:.45;outline:2px solid var(--blue)}
@media(max-width:600px){.guest-grid,.convention-overview{grid-template-columns:1fr}}
/* V1.2.7 episode library layouts and question review */
.episode-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.episode-gallery .episode{min-width:0;align-items:flex-start}
.episode-gallery .epactions{flex-direction:column;align-items:flex-end}
.episode-kanban{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;align-items:flex-start}
.kanban-lane{flex:0 0 270px;max-width:270px;background:#eef1f8;border:1px solid var(--line);border-radius:15px;padding:11px;min-height:180px}
.kanban-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:13px;margin-bottom:10px}
.kanban-count{background:#fff;border-radius:99px;padding:2px 8px;color:var(--muted);font-size:11px}
.kanban-lane .stack{gap:8px}
.kanban-lane .episode{padding:10px;align-items:flex-start}
.kanban-lane .epicon{width:34px;height:34px;font-size:17px}
.kanban-lane .epactions{display:flex;flex-direction:column;align-items:stretch;gap:5px}.kanban-lane .epactions .status{white-space:normal;text-align:center}
.episode-view-toggle{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
.episode-view-toggle button.active{background:var(--ink);color:#fff}
.question-review-row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.question-review-row input{margin-top:4px;accent-color:var(--blue);width:18px;height:18px;flex:none}
.question-review-row span{flex:1;min-width:0}
@media(max-width:600px){.episode-gallery{grid-template-columns:1fr}.kanban-lane{flex-basis:250px}}


/* V1.2.7: Kanban cards use a full-width, two-row layout instead of squeezing title text */
.episode-kanban{width:100%;max-width:100%;box-sizing:border-box;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.kanban-lane{box-sizing:border-box;flex:0 0 min(310px,86vw);width:min(310px,86vw);max-width:min(310px,86vw);min-width:0}
.kanban-lane .episode{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;width:100%;min-width:0;box-sizing:border-box;align-items:start}
.kanban-lane .epicon{grid-column:1;grid-row:1;width:34px;height:34px}
.kanban-lane .epbody{grid-column:2;grid-row:1;min-width:0;width:100%}
.kanban-lane .epbody b{white-space:normal;overflow-wrap:anywhere;word-break:normal;line-height:1.35}
.kanban-lane .epmeta{overflow-wrap:anywhere;line-height:1.45}
.kanban-lane .epactions{grid-column:1/-1;grid-row:2;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;min-width:0}
.kanban-lane .epactions .status{white-space:normal;text-align:left;max-width:100%}
.kanban-lane .epactions .btn{flex:0 0 auto}
.kanban-lane .bar{grid-column:1/-1}
@media(max-width:600px){.kanban-lane{flex-basis:min(290px,84vw);width:min(290px,84vw);max-width:min(290px,84vw)}}


.panel-day-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.panel-day-tabs button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:9px 14px;font-weight:700}
.panel-day-tabs button.active{background:var(--accent);color:white;border-color:var(--accent)}
.schedule-item{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.schedule-item:last-child{border-bottom:0}
.schedule-time{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.schedule-kind{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.schedule-guests{font-size:13px;color:var(--muted);margin-top:4px}
.panel-editor-row{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.panel-editor-row .row{align-items:end}
.guest-check-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.guest-check-grid label{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:9px}
@media(max-width:560px){.schedule-item{grid-template-columns:58px minmax(0,1fr)}.schedule-item>button{grid-column:2;justify-self:start}}

.interview-details-gate{border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0;background:var(--panel)}
.interview-details-gate .gate-note{font-size:13px;color:var(--muted);margin:5px 0 12px}
.invitation-summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.invitation-summary .tag{padding:7px 10px}

/* V1.5.1 responsive layout polish */
.split{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.split>section{min-width:0}
.split .episode{display:grid;grid-template-columns:minmax(0,1fr);align-items:start;gap:8px}
.split .epbody{width:100%;min-width:0}
.split .epbody b{overflow-wrap:break-word;word-break:normal}

<script>
const SUPABASE_URL="https://kzbfndtzcrnmqvbhkxmf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Iz1yza7ZokWP480Z9Q7XdA_JEIHGQ4v";
const supabaseClient=window.supabase?.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const STATUSES=[["🔍","Questions research"],["✍️","Questions ready"],["🎥","To film"],["✂️","To edit"],["👀","To validate"],["📅","Long format scheduled"],["📱","Shorts scheduled"],["🔗","Linktree updated"],["🎉","Published"],["⏸️","On hold"],["❌","Cancelled"],["📥","Footage transferred"],["🗂️","Footage organized & backed up"],["🎞️","Audio/video synchronized"],["✂️","Rough cut"],["🎬","Fine cut"],["🎨","Color & audio finishing"],["🖼️","Thumbnail in progress"],["📝","Metadata prepared"],["✅","Final review"]];
const uid=()=>Math.random().toString(36).slice(2,10);
const seed={guests:[],organizers:[{id:"org1",name:"Dream It"},{id:"org2",name:"Enter the Magical World"}],conventions:[{id:"con1",name:"Enter the Magical World 4",organizerId:"org2"},{id:"con2",name:"First Responders Reunion 9",organizerId:"org1"}],episodes:[{id:"ep9",number:9,guest:"Alfred Enoch",conventionId:"con1",date:"2026-10-23",status:8,questions:[{id:uid(),text:"What is a role you would love to revisit?",asked:false},{id:uid(),text:"What surprised you most about this project?",asked:false}],longLink:"",shorts:[],notes:"",time:"",duration:""}]};
let db;try{db=JSON.parse(localStorage.getItem("vault03"))||seed}catch(e){db=seed}if(!db.settings)db.settings={theme:"system",youtubeApiKey:""};
const DEFAULT_CHECKLIST=['Pyjama haut', 'Pyjama bas', 'Caleçons', 'Chaussetes', '2 Chemise', '2 Pantalon', 'Back up tenue', 'Lisseur', 'Sèche cheveux', 'Pied de telephone', 'Huile cheveux', 'Brosse', 'Vaporisateur', '3 ème pièce costar', 'Chaussures', 'Chargeur usb C', 'Moisturizer', 'Chargeur usb', 'Passeport', 'Multiprises', 'Rallonge', 'Montre', 'Chargeur montre', 'Lint roll', 'Cigarettes', 'Camera zv1', 'Camera zve10', 'Micro cravatte x2', 'Light', 'Trépied x2', 'Micro', 'Tablette', 'Chargeur tablette', 'Disque dur', 'Câbles chargeurs micros', 'Câble ventilateur', 'Ventilateur x2', 'Câble zv1'];if(!Array.isArray(db.checklistTemplate))db.checklistTemplate=DEFAULT_CHECKLIST.slice();
if(!Array.isArray(db.guests))db.guests=[];
function normalizeGuestName(n){return String(n||"").trim().replace(/\s+/g," ").toLowerCase()}
function ensureGuestProfiles(){db.episodes.forEach(e=>{if(!e.guest)return;let g=db.guests.find(x=>x.id===e.guestId)||db.guests.find(x=>normalizeGuestName(x.name)===normalizeGuestName(e.guest));if(!g){g={id:uid(),name:e.guest,photo:"",bio:"",notes:"",socials:{}};db.guests.push(g)}e.guestId=g.id})}
ensureGuestProfiles();
let view="home",editing=null,activeEpisode=null,inspireOffset=0,inspireSelected=new Set(),episodesMode="gallery";
let cloudUser=null, cloudChannel=null, syncTimer=null, syncBusy=false, applyingRemote=false, lastCloudPayload=null;

function syncEpisodeBudgetExpenses(){
 const episodes=Array.isArray(db.episodes)?db.episodes:[];
 const conventions=Array.isArray(db.conventions)?db.conventions:[];
 let changed=false;
 // Keep automatic costs for every non-cancelled episode, including published ones.
 // Published interviews still incurred editing and marketing costs.
 const eligible=episodes.filter(ep=>ep&&ep.id&&ep.conventionId&&Number(ep.status)!==10);
 const eligibleKeys=new Set(eligible.flatMap(ep=>["editing","marketing"].map(kind=>String(ep.id)+"|"+kind)));
 for(const c of conventions){
  if(!Array.isArray(c.expenses))c.expenses=[];
  const before=c.expenses.length;
  c.expenses=c.expenses.filter(x=>!x.autoEpisodeExpense||(
   eligibleKeys.has(String(x.episodeId)+"|"+String(x.autoEpisodeExpense))&&
   eligible.some(ep=>String(ep.id)===String(x.episodeId)&&String(ep.conventionId)===String(c.id))
  ));
  if(c.expenses.length!==before)changed=true;
  for(const ep of eligible.filter(e=>String(e.conventionId)===String(c.id))){
   for(const kind of ["editing","marketing"]){
    let matches=c.expenses.filter(x=>x.autoEpisodeExpense===kind&&String(x.episodeId)===String(ep.id));
    if(matches.length>1){
     const keep=matches[0];
     c.expenses=c.expenses.filter(x=>x===keep||!(x.autoEpisodeExpense===kind&&String(x.episodeId)===String(ep.id)));
     changed=true;
    }
    let x=matches[0];
    if(!x){x={id:uid(),episodeId:ep.id,autoEpisodeExpense:kind};c.expenses.push(x);changed=true}
    const title=(kind==="editing"?"Editing":"Marketing")+" Episode: "+(ep.guest||"Unnamed guest");
    const values={title,amount:50,date:c.startDate||"",category:kind};
    for(const [key,value] of Object.entries(values)){if(x[key]!==value){x[key]=value;changed=true}}
    if("episodeStatus" in x){delete x.episodeStatus;changed=true}
   }
  }
 }
 return changed;
}
function save(){
 syncEpisodeBudgetExpenses();
 localStorage.setItem("vault03",JSON.stringify(db));

function applyCloudPayload(payload){
 if(!payload || !Array.isArray(payload.organizers)||!Array.isArray(payload.conventions)||!Array.isArray(payload.episodes))throw new Error("The cloud data format is not valid.");
 applyingRemote=true;
 db={...db,guests:Array.isArray(payload.guests)?payload.guests:[],organizers:payload.organizers,conventions:payload.conventions,episodes:payload.episodes,checklistTemplate:Array.isArray(payload.checklistTemplate)?payload.checklistTemplate:DEFAULT_CHECKLIST.slice(),settings:payload.settings||db.settings||{theme:"system",youtubeApiKey:""},venues:Array.isArray(payload.venues)?payload.venues.map(v=>({...v,floorPlans:v.floorPlans||[]})):[],youtubeVideos:Array.isArray(payload.youtubeVideos)?payload.youtubeVideos:[]};ensureGuestProfiles();

async function syncNow(mode="both"){
 if(!cloudUser||!supabaseClient||!navigator.onLine)return;
 if(syncBusy)return;syncBusy=true;setSyncStatus("Syncing…");
 try{
  const {data:remote,error}=await supabaseClient.from("vault_sync_state").select("payload,updated_at").eq("owner_id",cloudUser.id).maybeSingle();
  if(error)throw error;
  const local=cloudPayload(), localText=JSON.stringify(local);
  if(mode==="pull"){
   if(remote?.payload){applyCloudPayload(remote.payload);setSyncStatus("Synced just now");}
   else setSyncStatus("Cloud is empty • ready to upload");
   return;
  }
  if(mode==="push"){
   const {error:upErr}=await supabaseClient.from("vault_sync_state").upsert({owner_id:cloudUser.id,payload:local,updated_at:new Date().toISOString()},{onConflict:"owner_id"});
   if(upErr)throw upErr;
   lastCloudPayload=localText;setSyncStatus("Synced just now");return;
  }
  if(remote?.payload){
   const remoteText=JSON.stringify(remote.payload);
   if(!lastCloudPayload){
    const hasLocal=local.organizers.length||local.conventions.length||local.episodes.length;
    if(hasLocal){
     const choice=confirm("Cloud data already exists. Press OK to DOWNLOAD it and replace this device's current data. Press Cancel to keep this device's data and upload it to the cloud.");
     if(choice){applyCloudPayload(remote.payload);setSyncStatus("Downloaded cloud data");}
     else{const {error:pushError}=await supabaseClient.from("vault_sync_state").upsert({owner_id:cloudUser.id,payload:local,updated_at:new Date().toISOString()},{onConflict:"owner_id"});if(pushError)throw pushError;lastCloudPayload=localText;setSyncStatus("Conflict resolved • this device kept");}
    }else{applyCloudPayload(remote.payload);setSyncStatus("Downloaded cloud data");}
   }else if(localText!==lastCloudPayload && remoteText!==lastCloudPayload && localText!==remoteText){
    const choice=confirm("This device and the cloud both changed since the last sync. OK = use cloud version on this device. Cancel = upload this device's version to the cloud.");
    if(choice){applyCloudPayload(remote.payload);setSyncStatus("Conflict resolved • cloud version kept");}
    else{const {error:pushError}=await supabaseClient.from("vault_sync_state").upsert({owner_id:cloudUser.id,payload:local,updated_at:new Date().toISOString()},{onConflict:"owner_id"});if(pushError)throw pushError;lastCloudPayload=localText;setSyncStatus("Conflict resolved • this device kept");}
   }else if(remoteText!==lastCloudPayload && localText===lastCloudPayload){applyCloudPayload(remote.payload);setSyncStatus("Downloaded changes from cloud");}
   else if(localText!==lastCloudPayload){const {error:pushError}=await supabaseClient.from("vault_sync_state").upsert({owner_id:cloudUser.id,payload:local,updated_at:new Date().toISOString()},{onConflict:"owner_id"});if(pushError)throw pushError;lastCloudPayload=localText;setSyncStatus("Changes uploaded");}
   else setSyncStatus("Everything is synced");
  }else{
   const {error:upErr}=await supabaseClient.from("vault_sync_state").upsert({owner_id:cloudUser.id,payload:local,updated_at:new Date().toISOString()},{onConflict:"owner_id"});
   if(upErr)throw upErr;lastCloudPayload=localText;setSyncStatus("First cloud backup complete");
  }
 }catch(err){setSyncStatus("Sync error");alert("The Vault could not sync: "+(err.message||String(err)));}
 finally{syncBusy=false;}
}
async function startRealtime(){
 if(!cloudUser||!supabaseClient)return;
 if(cloudChannel)await supabaseClient.removeChannel(cloudChannel);
 cloudChannel=supabaseClient.channel("vault-sync-"+cloudUser.id).on("postgres_changes",{event:"*",schema:"public",table:"vault_sync_state",filter:"owner_id=eq."+cloudUser.id},async payload=>{
  if(syncBusy)return;
  const remote=payload.new?.payload;if(!remote)return;
  const current=JSON.stringify(cloudPayload());
  if(current===lastCloudPayload){applyCloudPayload(remote);setSyncStatus("Live update received");}
  else{setSyncStatus("Another device changed data • sync to resolve");}
 }).subscribe();
}

function guestNameSimilarity(a,b){
 const clean=s=>normalizeGuestName(s).replace(/[^a-z0-9 ]/g,"").trim();
 a=clean(a);b=clean(b);if(!a||!b)return 0;if(a===b)return 1;
 const A=a.split(/\s+/),B=b.split(/\s+/),common=A.filter(x=>B.includes(x)).length;
 const token=common/Math.max(A.length,B.length);
 const lev=(x,y)=>{let row=Array.from({length:y.length+1},(_,i)=>i);for(let i=1;i<=x.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=y.length;j++){let t=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(x[i-1]===y[j-1]?0:1));prev=t}}return row[y.length]};
 const edit=1-lev(a,b)/Math.max(a.length,b.length);return Math.max(token,edit);
}
function possibleGuestDuplicates(name,excludeId=""){
 return db.guests.filter(g=>g.id!==excludeId&&guestNameSimilarity(g.name,name)>=.78).sort((a,b)=>guestNameSimilarity(b.name,name)-guestNameSimilarity(a.name,name));
}

function interviewDurationMinutes(value){
 if(value===null||value===undefined||String(value).trim()==="")return 15;
 const raw=String(value).trim();
 const numeric=Number(raw);
 if(Number.isFinite(numeric)&&numeric>0)return Math.round(numeric);

 if(match){const n=Number(match[1]);if(Number.isFinite(n)&&n>0)return Math.round(n)}

function plannerCalendar(c){
 if(!c)return "";
 let start=new Date((c.startDate||new Date().toISOString().slice(0,10))+"T12:00:00"),end=new Date((c.endDate||c.startDate||new Date().toISOString().slice(0,10))+"T12:00:00");

 for(;cursor<=end;cursor.setDate(cursor.getDate()+7)){let sat=new Date(cursor),sun=new Date(cursor);sun.setDate(sun.getDate()+1);weekends.push([new Date(sat),sun<=end?sun:null])}
 if(!weekends.length){let sat=new Date(start);sat.setDate(sat.getDate()-(sat.getDay()+1)%7);let sun=new Date(sat);sun.setDate(sun.getDate()+1);weekends=[[sat,sun]]}

 let events=[...(c.events||[]),...(c.panels||[]).map(x=>({title:x.title,date:x.date||plannerDate(c,x.day),time:x.time,kind:"Panel"})),...db.episodes.filter(e=>e.conventionId===c.id&&e.time).map(e=>({title:"Interview: "+e.guest,date:e.interviewDate||plannerDate(c,e.interviewDay),time:e.time,kind:"Interview"}))];

 return `<div class="week-nav"><button class="btn secondary small" ${idx===0?"disabled":""} onclick="window.plannerWeekIndex=${idx-1};render()">‹ Previous weekend</button><b>Weekend ${idx+1} of ${weekends.length}</b><button class="btn secondary small" ${idx===weekends.length-1?"disabled":""} onclick="window.plannerWeekIndex=${idx+1};render()">Next weekend ›</button></div><div class="week-calendar">${card(sat)}${card(sun)}</div>`;
}

async function refreshFlightStatus(conventionId,leg){
 let c=db.conventions.find(x=>x.id===conventionId),f=c?.flights?.[leg];
 if(!f?.flightNumber||!f.date)return;
 let target=document.getElementById("flightStatus-"+leg);
 if(!navigator.onLine){if(target)target.innerHTML='<span class="flight-status-dot offline"></span><span>You are offline. Connect to the internet and try again.</span>';return}
 if(target)target.textContent="Checking live flight status…";
 try{
  let url=VAULT_FLIGHT_WORKER_URL+"?"+new URLSearchParams({flight_iata:f.flightNumber.trim().toUpperCase(),flight_date:f.date});
  let response=await fetch(url,{method:"GET",headers:{Accept:"application/json"}});
  let result=await response.json();
  if(!response.ok)throw new Error(result.error||"Flight status service returned an error.");
  let found=(result.data||[])[0];
  if(!found)throw new Error("No matching flight was found. Check the flight number and date.");
  f.liveStatus=found;f.liveStatusCheckedAt=new Date().toISOString();save();
  if(target)target.innerHTML=renderFlightStatus(found);
 }catch(err){
  if(target)target.innerHTML='<span class="flight-status-dot offline"></span><span>'+esc(err.message||"Live status unavailable")+'</span>';
 }
}

 const publishedRate=active.length?Math.round(completed.length/active.length*100):0,cancelledTotal=db.episodes.filter(e=>e.status===10).length,cancellationRate=db.episodes.length?Math.round(cancelledTotal/db.episodes.length*100):0;

function uploadVenuePlans(venueId){
 let input=document.createElement("input");input.type="file";input.accept="image/jpeg,image/png,application/pdf,.jpg,.jpeg,.png,.pdf";input.multiple=true;

  save();render();if(v.floorPlans.length)openFloorplanEditor(venueId,v.floorPlans.length-1);

function compressPlanImage(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=()=>reject(Error("File could not be read"));reader.onload=()=>{let img=new Image();img.onerror=()=>reject(Error("Image could not be opened"));img.onload=()=>{let scale=Math.min(1,1800/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.82))};img.src=reader.result};reader.readAsDataURL(file)})}
async function pdfToPlanImages(file){
 if(!window.pdfjsLib){await new Promise((resolve,reject)=>{let s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=resolve;s.onerror=()=>reject(Error("PDF viewer could not load. Connect to the internet and try again."));document.head.appendChild(s)});window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}
 let bytes=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:bytes}).promise,pages=[];
 for(let n=1;n<=Math.min(pdf.numPages,12);n++){let page=await pdf.getPage(n),viewport=page.getViewport({scale:Math.min(1.7,1800/page.getViewport({scale:1}).width)}),canvas=document.createElement("canvas");canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;pages.push(canvas.toDataURL("image/jpeg",.84))}
 if(pdf.numPages>12)alert("Only the first 12 PDF pages were imported to keep the app responsive.");return pages;
}

function normalizeQuestion(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w\s]/g," ").replace(/\b(what|how|why|when|where|who|which|the|a|an|you|your|of|to|from|about|have|has|is|are|was|were|ever|most)\b/g," ").replace(/\s+/g," ").trim()}
function questionSimilarity(a,b){let A=new Set(normalizeQuestion(a).split(" ").filter(x=>x.length>2)),B=new Set(normalizeQuestion(b).split(" ").filter(x=>x.length>2));if(!A.size||!B.size)return 0;let n=[...A].filter(x=>B.has(x)).length;return n/(A.size+B.size-n)}
function detectDuplicateQuestions(){let rows=[...document.querySelectorAll("#editquestions .qrow")].map(r=>r.querySelector('[aria-label="Question"]')?.value.trim()).filter(Boolean),prior=db.episodes.filter(e=>e.id!==editing).flatMap(e=>(e.questions||[]).map(q=>({text:q.text,ep:epTitle(e)}))),hits=[];rows.forEach(q=>prior.forEach(p=>{let s=questionSimilarity(q,p.text);if(normalizeQuestion(q)===normalizeQuestion(p.text)||s>=.55)hits.push({q,p,s})}));showModal("Duplicate question check",hits.length?hits.slice(0,30).map(x=>`<div class="expense-row"><div><b>${esc(x.q)}</b><div class="smalltext">Similar to "${esc(x.p.text)}" · ${esc(x.p.ep)}</div></div><span class="tag">${Math.round(x.s*100)}%</span></div>`).join(""):'<div class="empty">No likely duplicates found.</div>')}

const PROJECT_TYPES=["Film","TV show","Podcast","Book","Other"];
// V1.6.3: migrate project credits from episodes to reusable guest profiles.
function migrateGuestProjects(){
 let changed=false;
 db.episodes.forEach(e=>{
  const g=db.guests.find(x=>x.id===e.guestId)||db.guests.find(x=>normalizeGuestName(x.name)===normalizeGuestName(e.guest));
  if(!g)return;
  if(!Array.isArray(g.projects))g.projects=[];
  (Array.isArray(e.projects)?e.projects:[]).forEach(raw=>{
   const p=raw&&typeof raw==="object"?raw:{title:String(raw||"")};
   const title=String(p.title??p.name??p.project??"").trim();
   if(!title)return;
   const key=title.toLocaleLowerCase();
   const existing=g.projects.find(x=>String(x.title??x.name??"").trim().toLocaleLowerCase()===key);
   if(existing){
    // Keep every field from the episode project, while retaining already-entered guest-profile values.
    Object.keys(p).forEach(k=>{if(existing[k]===undefined||existing[k]===null||existing[k]==="")existing[k]=p[k]});
    if(!existing.title)existing.title=title;
   }else{
    g.projects.push({...p,title,type:PROJECT_TYPES.includes(p.type)?p.type:(p.type||"Other")});
   }
   changed=true;
  });
  if(e.guestId!==g.id){e.guestId=g.id;changed=true}
  if(Array.isArray(e.projects)){delete e.projects;changed=true}
 });
 return changed;
}

 showModal("Manage convention panels",`<p class="sub">Build the stage schedule for this convention. Each panel can have its own day, start time, and guest lineup.</p><div class="sectionhead"><h3>Panels</h3><button type="button" class="btn blue small" onclick="addConventionPanel('${c.id}')">＋ Add panel</button></div>${c.panels.slice().sort((a,b)=>(a.day||"").localeCompare(b.day||"")||(a.time||"").localeCompare(b.time||"")).map(p=>`<div class="episode"><div class="epbody"><b>${esc(p.title||"Untitled panel")}</b><div class="epmeta">${esc(p.day||"Day not set")} · ${esc(p.time||"Time not set")}${p.time?`–${esc(addMinutesToTime(p.time,30))}`:""}${p.room?" · "+esc(p.room):""} · ${(p.guestIds||[]).map(id=>esc(db.guests.find(g=>g.id===id)?.name||"")).filter(Boolean).join(", ")||"No guests selected"}</div></div><div class="epactions"><button class="btn secondary small" onclick="editConventionPanel('${c.id}','${p.id}')">Edit</button><button class="btn danger small" onclick="deleteConventionPanel('${c.id}','${p.id}')">Delete</button></div></div>`).join("")||'<div class="empty">No panels added yet.</div>'}<div class="row" style="margin-top:14px"><button class="btn secondary" onclick="closeModal()">Done</button></div>`);
}

function editConventionPanel(conventionId,panelId){
 const c=conv(conventionId);if(!c)return;if(!Array.isArray(c.panels))c.panels=[];
 const p=c.panels.find(x=>x.id===panelId)||{id:"",title:"",day:"Saturday",time:"",guestIds:[],notes:""};
 const guestOptions=(c.guestIds||[]).map(id=>db.guests.find(g=>g.id===id)).filter(Boolean);
 if(!guestOptions.length){alert("Add guests to this convention first. Edit the convention and select its guest lineup.");return}
 showModal(panelId?"Edit panel":"Add panel",`<form id="panel-form"><div class="field"><label>Panel title</label><input name="title" value="${esc(p.title)}" placeholder="e.g. The world of..." required></div><div class="row"><div class="field"><label>Day</label><select name="day">${["Saturday","Sunday"].map(d=>`<option ${p.day===d?"selected":""}>${d}</option>`).join("")}</select></div><div class="field"><label>Start time</label><input type="time" name="time" value="${esc(p.time)}" required></div></div><div class="field"><label>Room / location</label><input name="room" value="${esc(p.room||"")}" placeholder="e.g. Panel Room A, Interview Room 2"></div><div class="field"><label>Panel duration</label><div class="fixed-duration-display">30 minutes</div><div class="smalltext">All convention panels are scheduled for 30 minutes.</div></div><div class="field"><label>Guests on this panel</label><div class="guest-check-grid">${guestOptions.map(g=>`<label><input type="checkbox" name="panelguest_${g.id}" ${(p.guestIds||[]).includes(g.id)?"checked":""}><span>${esc(g.name)}</span></label>`).join("")}</div></div><div class="field"><label>Notes (optional)</label><textarea name="notes">${esc(p.notes||"")}</textarea></div><div class="row"><button class="btn blue">Save panel</button><button type="button" class="btn secondary" onclick="managePanels('${c.id}')">Cancel</button></div></form>`);
 document.getElementById("panel-form").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const panel={...p,id:p.id||uid(),title:String(f.get("title")||"").trim(),day:f.get("day"),time:f.get("time"),room:String(f.get("room")||"").trim(),duration:30,guestIds:guestOptions.filter(g=>f.get("panelguest_"+g.id)==="on").map(g=>g.id),notes:String(f.get("notes")||"")};if(!panel.guestIds.length&&!confirm("No guests are selected for this panel. Save it anyway?"))return;const i=c.panels.findIndex(x=>x.id===panel.id);if(i<0)c.panels.push(panel);else c.panels[i]=panel;save();managePanels(c.id)};
}
function deleteConventionPanel(conventionId,panelId){const c=conv(conventionId);if(!c||!confirm("Delete this panel?"))return;c.panels=(c.panels||[]).filter(p=>p.id!==panelId);save();managePanels(c.id)}
function duplicateConvention(id){const c=db.conventions.find(x=>x.id===id);if(!c)return;db.conventions.push({id:uid(),name:c.name+" (Copy)",organizerId:c.organizerId,startDate:c.startDate,endDate:c.endDate,hotelName:c.hotelName||"",hotelAddress:c.hotelAddress||"",hotelRoom:c.hotelRoom||"",checklist:[false,false,false,false,false,false],guestIds:(c.guestIds||[]).slice(),flights:JSON.parse(JSON.stringify(c.flights||{})),panels:[]});save();render()}
function delConvention(id){let n=db.episodes.filter(e=>e.conventionId===id).length;if(!confirm(n?`This convention is linked to ${n} episode(s). Delete the convention? Episodes will remain, with the convention shown as TBD.`:"Delete convention?"))return;db.conventions=db.conventions.filter(c=>c.id!==id);save();render()}
function getInspired(eid){let current=db.episodes.find(x=>x.id===eid)||db.episodes.find(x=>x.id===activeEpisode);if(!current){alert("Save this episode first, then use Get Inspired.");return}let today=new Date();today.setHours(0,0,0,0);let pool=db.episodes.flatMap(e=>{let c=db.conventions.find(c=>c.id===e.conventionId);if(!c||!c.endDate)return[];let end=new Date(c.endDate+"T00:00:00");if(Number.isNaN(end.getTime())||end>=today)return[];return(e.questions||[]).filter(q=>q&&String(q.text||"").trim()&&q.asked!==true).map(q=>({...q,source:e,sourceId:e.id}))});let editorRows=[...document.querySelectorAll("#editquestions .qrow")].map(r=>({id:r.querySelector("[data-qid]")?.dataset.qid||uid(),text:r.querySelector('input[aria-label="Question"]')?.value.trim()||r.querySelector('input:not([type=checkbox])')?.value.trim()||"",asked:r.querySelector('input[type=checkbox]')?.checked||false})).filter(q=>q.text&&!q.asked);editorRows.forEach(q=>{if(!pool.some(p=>p.text===q.text))pool.push({...q,source:current,sourceId:current.id,unsaved:true})});pool=pool.filter((q,i,a)=>a.findIndex(x=>x.text.toLowerCase()===q.text.toLowerCase())===i);inspireOffset=0;inspireSelected=new Set();inspireModal(current,pool)}
function inspireModal(current,pool){let batch=pool.slice(inspireOffset,inspireOffset+20);showModal("✦ Get Inspired",`<p class="sub">Choose up to 20 unused questions. Selected questions are moved into this interview: they are removed from their original interview and added here. Any questions already entered here will be kept.</p><div class="picklist">${batch.map(q=>`<label class="pick"><input type="checkbox" value="${q.id}" ${inspireSelected.has(q.id)?'checked':''}><span><b>${esc(q.text)}</b><div class="smalltext">From ${esc(epTitle(q.source))}</div></span></label>`).join("")||'<div class="empty">No more unused questions in this batch.</div>'}</div><div class="sectionhead" style="margin-top:14px"><span class="smalltext">${Math.min(pool.length-inspireOffset,20)} shown · ${inspireSelected.size} selected</span><div class="row" style="flex:0 1 auto"><button class="btn secondary small" id="moreinspire" ${inspireOffset+20>=pool.length?'disabled':''}>Show more</button><button class="btn blue small" id="addinspire">Add selected</button></div></div><button class="btn secondary small" id="cancelinspire">Cancel</button>`);document.querySelectorAll(".pick input").forEach(cb=>cb.onchange=()=>{if(cb.checked)inspireSelected.add(cb.value);else inspireSelected.delete(cb.value);if(inspireSelected.size>20){inspireSelected.delete(cb.value);cb.checked=false;alert("Select up to 20 questions at a time.")} });document.getElementById("moreinspire").onclick=()=>{document.querySelectorAll(".pick input:checked").forEach(cb=>inspireSelected.add(cb.value));inspireOffset+=20;inspireModal(current,pool)};document.getElementById("cancelinspire").onclick=closeModal;document.getElementById("addinspire").onclick=()=>{let chosen=pool.filter(q=>inspireSelected.has(q.id));chosen.forEach(q=>{const text=String(q.text||"").trim();if(!text)return;const exists=(current.questions||[]).some(x=>String(x.text||"").trim().toLowerCase()===text.toLowerCase());if(!exists)current.questions.push({id:uid(),text,asked:false});if(!q.unsaved&&q.sourceId&&q.sourceId!==current.id){const source=db.episodes.find(e=>e.id===q.sourceId);if(source&&Array.isArray(source.questions)){let removed=false;source.questions=source.questions.filter(x=>{if(!removed&&q.id&&x.id===q.id){removed=true;return false}return true});if(!removed){let idx=source.questions.findIndex(x=>String(x.text||"").trim().toLowerCase()===text.toLowerCase());if(idx!==-1)source.questions.splice(idx,1)}}}});save();closeModal();openEpisode(current.id)}}
function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="the-vault-backup.json";a.click();URL.revokeObjectURL(a.href)}
document.getElementById("exportBtn").onclick=exportBackup;

document.getElementById("importFile").onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(!incoming||!Array.isArray(incoming.organizers)||!Array.isArray(incoming.conventions)||!Array.isArray(incoming.episodes))throw new Error("This file does not look like a Vault backup.");if(!confirm("Import this backup and replace the data saved on this device? Export a backup first if you want to keep the current data."))return;db=incoming;if(!Array.isArray(db.checklistTemplate))db.checklistTemplate=DEFAULT_CHECKLIST.slice();save();render();alert("Backup imported.");}catch(err){alert("Could not import backup: "+err.message)}finally{e.target.value=""}};
