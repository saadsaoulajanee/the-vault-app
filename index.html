/* V0.4.4: keep episode cards compact while allowing their questions to scroll */
.episode-questions,
.question-list,
.questions-list,
.episode-card .questions,
.episode-card .question-list {
  max-height: 320px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-right: 6px;

  max-height: min(42vh, 360px);
  overflow-y: auto;

  padding: 0 8px 0 0;
  scrollbar-gutter: stable;

}

  width: min(100%, 440px);

/* V0.4.7: Vault-styled episode picker instead of Android's native select popup */
.episode-picker-trigger {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  width:100%; min-width:0; min-height:46px; padding:10px 14px;
  border:1px solid var(--line); border-radius:14px; background:#fff;
  color:var(--ink); font:inherit; font-weight:700; text-align:left;
  box-shadow:0 1px 2px rgba(20,30,50,.03); cursor:pointer;

.episode-picker-trigger span { flex:0 0 auto; color:var(--muted); font-size:20px; }
.episode-picker-list { display:grid; gap:8px; max-height:60vh; overflow-y:auto; }
.episode-picker-option {
  display:block; width:100%; padding:13px 14px; border:1px solid var(--line);
  border-radius:12px; background:#fff; color:var(--ink); text-align:left;
  font:inherit; font-weight:650; cursor:pointer;
}
.episode-picker-option.selected { border-color:var(--blue); background:var(--softblue); }

.vault-select-wrap{position:relative;min-width:0;flex:1}

.vault-select-button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-width:0;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;text-align:left;cursor:pointer}

.vault-select-button .vault-select-chevron{flex:0 0 auto;color:var(--muted)}
.vault-picker-options{display:grid;gap:8px;max-height:60vh;overflow:auto}
.vault-picker-option{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.vault-picker-option.selected{border-color:var(--blue);background:var(--softblue);font-weight:700}

.vault-select-panel{width:min(460px,100%);max-height:min(78vh,680px);overflow:hidden;display:flex;flex-direction:column;background:var(--paper,#fff);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 70px rgba(10,20,40,.28)}

.episode-number{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--blue);background:var(--softblue);border-radius:7px;padding:3px 7px;margin-right:5px;vertical-align:2px}

.episode-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}

 if(syncBusy)return;syncBusy=true;setSyncStatus("Syncing…");
 try{
  const {data:remote,error}=await supabaseClient.from("vault_sync_state").select("payload,updated_at").eq("owner_id",cloudUser.id).maybeSingle();
  if(error)throw error;
  const local=cloudPayload(), localText=JSON.stringify(local);
  if(mode==="pull"){
   if(remote?.payload){applyCloudPayload(remote.payload);setSyncStatus("Synced just now");}
   else setSyncStatus("Cloud is empty • ready to upload");
   return;
  }
  if(mode==="push"){
   const {error:upErr}=await supabaseClient.from("vault_sync_state").upsert({owner_id:cloudUser.id,payload:local,updated_at:new Date().toISOString()},{onConflict:"owner_id"});
   if(upErr)throw upErr;
   lastCloudPayload=localText;setSyncStatus("Synced just now");return;
  }
  if(remote?.payload){
   const remoteText=JSON.stringify(remote.payload);
   if(!lastCloudPayload){
    const hasLocal=local.organizers.length||local.conventions.length||local.episodes.length;
    if(hasLocal){
     const choice=confirm("Cloud data already exists. Press OK to DOWNLOAD it and replace this device's current data. Press Cancel to keep this device's data and upload it to the cloud.");
     if(choice){applyCloudPayload(remote.payload);setSyncStatus("Downloaded cloud data");}
     else{const {error:pushError}=await supabaseClient.from("vault_sync_state").upsert({owner_id:cloudUser.id,payload:local,updated_at:new Date().toISOString()},{onConflict:"owner_id"});if(pushError)throw pushError;lastCloudPayload=localText;setSyncStatus("Conflict resolved • this device kept");}
    }else{applyCloudPayload(remote.payload);setSyncStatus("Downloaded cloud data");}
   }else if(localText!==lastCloudPayload && remoteText!==lastCloudPayload && localText!==remoteText){
    const choice=confirm("This device and the cloud both changed since the last sync. OK = use cloud version on this device. Cancel = upload this device's version to the cloud.");
    if(choice){applyCloudPayload(remote.payload);setSyncStatus("Conflict resolved • cloud version kept");}
    else{const {error:pushError}=await supabaseClient.from("vault_sync_state").upsert({owner_id:cloudUser.id,payload:local,updated_at:new Date().toISOString()},{onConflict:"owner_id"});if(pushError)throw pushError;lastCloudPayload=localText;setSyncStatus("Conflict resolved • this device kept");}
   }else if(remoteText!==lastCloudPayload && localText===lastCloudPayload){applyCloudPayload(remote.payload);setSyncStatus("Downloaded changes from cloud");}
   else if(localText!==lastCloudPayload){const {error:pushError}=await supabaseClient.from("vault_sync_state").upsert({owner_id:cloudUser.id,payload:local,updated_at:new Date().toISOString()},{onConflict:"owner_id"});if(pushError)throw pushError;lastCloudPayload=localText;setSyncStatus("Changes uploaded");}
   else setSyncStatus("Everything is synced");
  }else{
   const {error:upErr}=await supabaseClient.from("vault_sync_state").upsert({owner_id:cloudUser.id,payload:local,updated_at:new Date().toISOString()},{onConflict:"owner_id"});
   if(upErr)throw upErr;lastCloudPayload=localText;setSyncStatus("First cloud backup complete");
  }
 }catch(err){setSyncStatus("Sync error");alert("The Vault could not sync: "+(err.message||String(err)));}
 finally{syncBusy=false;}
}
async function startRealtime(){
 if(!cloudUser||!supabaseClient)return;
 if(cloudChannel)await supabaseClient.removeChannel(cloudChannel);
 cloudChannel=supabaseClient.channel("vault-sync-"+cloudUser.id).on("postgres_changes",{event:"*",schema:"public",table:"vault_sync_state",filter:"owner_id=eq."+cloudUser.id},async payload=>{
  if(syncBusy)return;
  const remote=payload.new?.payload;if(!remote)return;
  const current=JSON.stringify(cloudPayload());
  if(current===lastCloudPayload){applyCloudPayload(remote);setSyncStatus("Live update received");}
  else{setSyncStatus("Another device changed data • sync to resolve");}
 }).subscribe();
}

function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function org(id){return db.organizers.find(x=>x.id===id)?.name||"No organizer"}
function conv(id){return db.conventions.find(x=>x.id===id)}
function epTitle(e){return `${e.guest||"Untitled guest"} – ${conv(e.conventionId)?.name||"Convention TBD"}`}
function toDMY(d){if(!d)return "";let m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:d}
function fromDMY(d){let m=String(d||"").trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);if(!m)return "";let day=+m[1],month=+m[2],year=+m[3],x=new Date(year,month-1,day);return x.getFullYear()===year&&x.getMonth()===month-1&&x.getDate()===day?`${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`:""}
function fmt(d){if(!d)return "Date not set";return toDMY(d)}
function nextDate(){let dates=db.episodes.filter(e=>e.date).map(e=>e.date).sort();if(!dates.length)return "";let d=new Date(dates[dates.length-1]+"T12:00:00");d.setDate(d.getDate()+14);return d.toISOString().slice(0,10)}
function nextNum(){return Math.max(0,...db.episodes.map(e=>+e.number||0))+1}
function progress(e){return e.status===8?100:e.status===10?0:Math.min(100,Math.round((e.status+1)/9*100))}
function episodeCard(e){let st=STATUSES[e.status]||STATUSES[0],cancelled=e.status===10;return `<article class="episode ${cancelled?'episode-cancelled':''}" onclick="openEpisode('${e.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')openEpisode('${e.id}')"><div class="epicon">${cancelled?'✕':'🎙️'}</div><div class="epbody"><b><span class="episode-number ${cancelled?'number-cancelled':''}">${cancelled?'X':`#${esc(e.number)}`}</span> ${esc(epTitle(e))}</b><div class="epmeta">${esc(org(conv(e.conventionId)?.organizerId))} · ${cancelled?"Not scheduled for publication":fmt(e.date)}${e.interviewDay?` · Interview: ${esc(e.interviewDay)}`:""} · Guest: ${esc(e.guestStatus||"Invited")}</div><div class="bar"><i style="width:${progress(e)}%"></i></div></div><div class="epactions"><span class="status ${e.status===8?'published':cancelled?'cancelled':''}">${st[0]} ${esc(st[1])}</span><button class="btn secondary small" ${e.longLink?'':'disabled'} onclick="event.stopPropagation();window.open('${esc(e.longLink)}','_blank','noopener')">▶ Watch</button></div></article>`}

function upgradeVaultSelects(root=document){
 root.querySelectorAll('select:not([data-vault-upgraded]):not([data-native-picker])').forEach(sel=>{
  sel.dataset.vaultUpgraded="1";
  const wrap=document.createElement("div");wrap.className="vault-select-wrap";
  sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);
  const btn=document.createElement("button");btn.type="button";btn.className="vault-select-button";
  btn.innerHTML='<span class="vault-select-label"></span><span class="vault-select-chevron" aria-hidden="true">⌄</span>';
  wrap.appendChild(btn);
  const refresh=()=>{btn.querySelector(".vault-select-label").textContent=sel.selectedOptions[0]?.textContent||"Choose…";};
  refresh();
  btn.addEventListener("click",()=>{
   document.getElementById("vault-select-overlay")?.remove();
   const opts=[...sel.options].map((o,i)=>({label:o.textContent,disabled:o.disabled,selected:o.selected,index:i}));
   window.__vaultPickerSelect=sel;
   const overlay=document.createElement("div");overlay.id="vault-select-overlay";overlay.className="vault-select-overlay";
   overlay.innerHTML=`<div class="vault-select-panel" role="dialog" aria-modal="true"><div class="modhead"><strong>Choose an option</strong><button type="button" class="btn secondary small" id="vault-select-close">✕</button></div><div class="modalbody"><div class="vault-picker-options">${opts.map(o=>`<button type="button" class="vault-picker-option ${o.selected?'selected':''}" ${o.disabled?'disabled':''} data-option-index="${o.index}">${esc(o.label)}</button>`).join("")}</div></div></div>`;
   overlay.addEventListener("click",ev=>{if(ev.target===overlay)closeVaultSelectPicker()});
   overlay.querySelector("#vault-select-close").addEventListener("click",closeVaultSelectPicker);
   overlay.querySelectorAll("[data-option-index]").forEach(option=>option.addEventListener("click",()=>chooseVaultSelect(Number(option.dataset.optionIndex))));
   document.body.appendChild(overlay);
  });
  sel.addEventListener("change",refresh);
 });
}

function syncEpisodeStatusFields(){
 const form=document.getElementById("epform"),status=form?.querySelector('[name="status"]'),numberBox=document.getElementById("episodeNumberField"),dateBox=document.getElementById("publishDateField");

  const d=dateBox.querySelector('[name="date"]');if(d){d.value="";d.disabled=true}
 }else{
  if(!numberBox.querySelector('[name="number"]'))numberBox.innerHTML=`<label>Episode number</label><input name="number" type="number" min="1" value="${nextNum()}" required>`;
  const d=dateBox.querySelector('[name="date"]');if(d)d.disabled=false;
 }
}

nk" type="url" value="${esc(e.longLink||"")}" placeholder="https://..."></div><div class="field"><label>Quick notes / standout moments / follow-ups</label><textarea name="notes">${esc(e.notes||"")}</textarea></div><div class="field"><div class="sectionhead"><h3>Guest projects</h3><button type="button" class="btn secondary small" onclick="addProjectRow()">＋ Add project</button></div><div class="smalltext">Films, TV, podcasts, books, and other credits to keep handy during the interview.</div><div id="projectlist" class="project-editor-list">${projectEditor(e)}</div></div><div class="sectionhead"><h3>Questions</h3><button type="button" class="btn secondary small" onclick="bulkQuestions()">＋ Bulk import</button></div><div id="editquestions">${questionEditor(e)}</div><div class="row"><button type="button" class="btn secondary" onclick="addQuestion()">＋ Add question</button><button type="button" class="btn pink" onclick="getInspired('${e.id||""}')">✦ Get Inspired</button></div><div class="field" style="margin-top:16px"><label>Shorts tracking (up to six)</label><div class="smalltext">Each short can be tracked by platform and link.</div><div id="shorts">${shortEditor(e)}</div><button type="button" class="btn secondary small" onclick="addShort()">＋ Add Short</button></div><div class="row" style="margin-top:18px"><button class="btn blue" type="submit">Save episode</button>${existing?`<button type="button" class="btn danger" onclick="deleteEpisode('${e.id}')">Delete episode</button>`:""}<button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`}
function questionEditor(e){return (e.questions||[]).map(q=>`<div class="qrow"><input type="checkbox" ${q.asked?'checked':''} title="Asked"><input style="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px" value="${esc(q.text)}" data-qid="${q.id}" aria-label="Question"><button type="button" class="btn danger small" onclick="this.parentElement.remove()">×</button></div>`).join("")}
function addQuestion(){let box=document.getElementById("editquestions");let div=document.createElement("div");div.className="qrow";div.innerHTML='<input type="checkbox" title="Asked"><input style="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px" aria-label="Question" placeholder="Write a question"><button type="button" class="btn danger small" onclick="this.parentElement.remove()">×</button>';box.appendChild(div)}
function bulkQuestions(){let old=document.getElementById("bulkpanel");if(old){old.remove();return}let panel=document.createElement("div");panel.id="bulkpanel";panel.className="card";panel.style.cssText="margin:12px 0;padding:14px;background:#f8f9fd";panel.innerHTML=`<div class="field"><label>Paste one question per line</label><textarea id="bulktext" rows="6" placeholder="Question one&#10;Question two&#10;Question three"></textarea></div><div class="row"><button type="button" class="btn blue" id="bulkAdd">Add questions</button><button type="button" class="btn secondary" id="bulkCancel">Cancel</button></div>`;document.getElementById("editquestions").after(panel);document.getElementById("bulkAdd").onclick=applyBulk;document.getElementById("bulkCancel").onclick=()=>panel.remove()}
function applyBulk(){let field=document.getElementById("bulktext"),box=document.getElementById("editquestions");if(!field||!box)return;let lines=field.value.split(/\r\n|\n|\r/).map(x=>x.trim()).filter(Boolean);if(!lines.length){alert("Paste at least one question, with one question per line.");return}lines.forEach(text=>{let div=document.createElement("div");div.className="qrow";let check=document.createElement("input");check.type="checkbox";check.title="Asked";let input=document.createElement("input");input.style.cssText="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px";input.setAttribute("aria-label","Question");input.value=text;let remove=document.createElement("button");remove.type="button";remove.className="btn danger small";remove.textContent="×";remove.onclick=()=>div.remove();div.append(check,input,remove);box.appendChild(div)});document.getElementById("bulkpanel")?.remove()}
function shortEditor(e){return (e.shorts||[]).map((s,i)=>`<div class="row" style="margin:8px 0"><select data-shortplatform="${i}"><option ${s.platform==="YouTube"?'selected':''}>YouTube</option><option ${s.platform==="TikTok"?'selected':''}>TikTok</option><option ${s.platform==="Instagram"?'selected':''}>Instagram</option></select><input data-shortlink="${i}" placeholder="Short link" value="${esc(s.link||"")}"><button type="button" class="btn danger small" onclick="this.parentElement.remove()">×</button></div>`).join("")}

document.getElementById("modbody").addEventListener?.("submit",()=>{});
document.addEventListener("submit",e=>{if(e.target.id!=="epform")return;e.preventDefault();let f=new FormData(e.target),id=editing||uid();let old=db.episodes.find(x=>x.id===id)||{};let qs=[...document.querySelectorAll("#editquestions .qrow")].map(r=>({id:r.querySelector("[data-qid]")?.dataset.qid||uid(),text:r.querySelector('input[aria-label="Question"]')?.value.trim()||r.querySelector('input:not([type=checkbox])')?.value.trim()||"",asked:r.querySelector('input[type=checkbox]')?.checked||false})).filter(q=>q.text);let shorts=[...document.querySelectorAll("#shorts .row")].map(r=>({platform:r.querySelector("select").value,link:r.querySelector("input").value}));let status=+f.get("status"),cancelled=status===10;let ep={...old,id,number:cancelled?null:(+f.get("number")||nextNum()),guest:f.get("guest").trim(),guestStatus:f.get("guestStatus")||"Invited",conventionId:f.get("conventionId"),date:cancelled?"":f.get("date"),status,interviewDay:f.get("interviewDay")||"",time:f.get("time"),duration:f.get("duration"),longLink:f.get("longLink"),notes:f.get("notes"),projects:[...document.querySelectorAll("#projectlist .project-editor-row")].map(r=>({title:r.querySelector('input[aria-label="Project title"]').value.trim(),type:r.querySelector(".project-type-button").dataset.type||"Film"})).filter(p=>p.title),questions:qs,shorts};let idx=db.episodes.findIndex(x=>x.id===id);if(idx<0)db.episodes.push(ep);else db.episodes[idx]=ep;save();closeModal();render()});
function toggleAsked(eid,qid,val){let e=db.episodes.find(x=>x.id===eid),q=e?.questions.find(x=>x.id===qid);if(q){q.asked=val;save();render()}}

function editOrganizer(id){let o=db.organizers.find(x=>x.id===id)||{id:"",name:""};showModal(id?"Edit organizer":"Add organizer",`<form id="orgform"><div class="field"><label>Organizer name</label><input name="name" value="${esc(o.name)}" required></div><button class="btn blue">Save organizer</button></form>`);document.getElementById("orgform").onsubmit=e=>{e.preventDefault();let name=new FormData(e.target).get("name").trim();if(o.id)o.name=name;else db.organizers.push({id:uid(),name});save();closeModal();render()}}
function delOrganizer(id){let linked=db.conventions.filter(c=>c.organizerId===id);if(!confirm(linked.length?`This organizer is linked to ${linked.length} convention(s). Delete organizer? Conventions and episodes will remain.`:"Delete organizer?"))return;db.organizers=db.organizers.filter(o=>o.id!==id);save();render()}
function setupOrganizerPicker(){const sel=document.querySelector('#conform select[name="organizerId"]');if(!sel)return;const wrap=document.createElement("div");wrap.className="organizer-picker-wrap";sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);sel.style.display="none";const btn=document.createElement("button");btn.type="button";btn.className="organizer-picker-button";wrap.appendChild(btn);const label=()=>sel.selectedOptions[0]?.textContent||"Choose organizer";const refresh=()=>btn.innerHTML=`<span>${esc(label())}</span><span aria-hidden="true">⌄</span>`;refresh();btn.onclick=()=>{const overlay=document.createElement("div");overlay.className="organizer-picker-overlay";overlay.innerHTML=`<div class="organizer-picker-panel" role="dialog" aria-modal="true"><h3 class="organizer-picker-title">Choose organizer</h3>${[...sel.options].map((o,i)=>`<button type="button" class="organizer-picker-option ${o.selected?"selected":""}" data-index="${i}">${esc(o.textContent)}</button>`).join("")}</div>`;overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.remove()});overlay.querySelectorAll("button[data-index]").forEach(b=>b.onclick=()=>{sel.selectedIndex=+b.dataset.index;sel.dispatchEvent(new Event("change",{bubbles:true}));refresh();overlay.remove()});document.body.appendChild(overlay)}}
function editConvention(id){let c=db.conventions.find(x=>x.id===id)||{id:"",name:"",organizerId:"",startDate:"",endDate:"",checklist:[]};showModal(id?"Edit convention":"Add convention",`<form id="conform"><div class="field"><label>Convention name</label><input name="name" value="${esc(c.name)}" required></div><div class="row"><div class="field"><label>Start date</label><input name="startDate" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" value="${toDMY(c.startDate)}" required></div><div class="field"><label>End date</label><input name="endDate" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" value="${toDMY(c.endDate)}" required></div></div><div class="field"><label>Convention packing checklist</label><div class="checklist-scroll">${db.checklistTemplate.map((item,i)=>`<label class="checkrow"><input type="checkbox" name="prep${i}" ${c.checklist?.[i]?"checked":""}><span>${esc(item)}</span></label>`).join("")}</div></div><div class="field"><label>Organizer</label><select name="organizerId" data-native-picker><option value="">Choose organizer</option>${db.organizers.map(o=>`<option value="${o.id}" ${c.organizerId===o.id?'selected':''}>${esc(o.name)}</option>`).join("")}</select></div><button class="btn blue">Save convention</button></form>`);setupOrganizerPicker();document.getElementById("conform").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let start=fromDMY(f.get("startDate")),end=fromDMY(f.get("endDate"));if(!start||!end){alert("Enter valid dates as DD/MM/YYYY.");return}if(c.id){c.name=f.get("name").trim();c.organizerId=f.get("organizerId");c.startDate=start;c.endDate=end;c.checklist=db.checklistTemplate.map((_,i)=>f.get("prep"+i)==="on")}else db.conventions.push({id:uid(),name:f.get("name").trim(),organizerId:f.get("organizerId"),startDate:start,endDate:end,checklist:db.checklistTemplate.map((_,i)=>f.get("prep"+i)==="on")});save();closeModal();render()}}
function editChecklistTemplate(){showModal("Edit packing checklist",`<div class="smalltext">One item per line. Changes apply to new conventions and the checklist shown when editing existing ones.</div><textarea id="checklist-template" rows="14" style="width:100%;max-width:100%;height:42vh;max-height:420px;min-height:180px;box-sizing:border-box;overflow-y:auto;resize:vertical;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0">${esc(db.checklistTemplate.join("\n"))}</textarea><div class="row"><button class="btn blue" onclick="saveChecklistTemplate()">Save template</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`)}
function saveChecklistTemplate(){db.checklistTemplate=document.getElementById("checklist-template").value.split(/\n/).map(x=>x.trim()).filter(Boolean);db.conventions.forEach(c=>{c.checklist=db.checklistTemplate.map((_,i)=>!!c.checklist?.[i])});save();closeModal();render()}
function duplicateConvention(id){const c=db.conventions.find(x=>x.id===id);if(!c)return;db.conventions.push({id:uid(),name:c.name+" (Copy)",organizerId:c.organizerId,startDate:c.startDate,endDate:c.endDate,checklist:[false,false,false,false,false,false]});save();render()}
function delConvention(id){let n=db.episodes.filter(e=>e.conventionId===id).length;if(!confirm(n?`This convention is linked to ${n} episode(s). Delete the convention? Episodes will remain, with the convention shown as TBD.`:"Delete convention?"))return;db.conventions=db.conventions.filter(c=>c.id!==id);save();render()}
function getInspired(eid){let current=db.episodes.find(x=>x.id===eid)||db.episodes.find(x=>x.id===activeEpisode);if(!current){alert("Save this episode first, then use Get Inspired.");return}let today=new Date();today.setHours(0,0,0,0);let pool=db.episodes.flatMap(e=>{let c=db.conventions.find(c=>c.id===e.conventionId);if(!c||!c.endDate)return[];let end=new Date(c.endDate+"T00:00:00");if(Number.isNaN(end.getTime())||end>=today)return[];return(e.questions||[]).filter(q=>q&&String(q.text||"").trim()&&q.asked!==true).map(q=>({...q,source:e,sourceId:e.id}))});let editorRows=[...document.querySelectorAll("#editquestions .qrow")].map(r=>({id:r.querySelector("[data-qid]")?.dataset.qid||uid(),text:r.querySelector('input[aria-label="Question"]')?.value.trim()||r.querySelector('input:not([type=checkbox])')?.value.trim()||"",asked:r.querySelector('input[type=checkbox]')?.checked||false})).filter(q=>q.text&&!q.asked);editorRows.forEach(q=>{if(!pool.some(p=>p.text===q.text))pool.push({...q,source:current,sourceId:current.id,unsaved:true})});pool=pool.filter((q,i,a)=>a.findIndex(x=>x.text.toLowerCase()===q.text.toLowerCase())===i);inspireOffset=0;inspireSelected=new Set();inspireModal(current,pool)}
function inspireModal(current,pool){let batch=pool.slice(inspireOffset,inspireOffset+20);showModal("✦ Get Inspired",`<p class="sub">Choose up to 20 unused questions. Selected questions move to this guest only after you confirm.</p><div class="picklist">${batch.map(q=>`<label class="pick"><input type="checkbox" value="${q.id}" ${inspireSelected.has(q.id)?'checked':''}><span><b>${esc(q.text)}</b><div class="smalltext">From ${esc(epTitle(q.source))}</div></span></label>`).join("")||'<div class="empty">No more unused questions in this batch.</div>'}</div><div class="sectionhead" style="margin-top:14px"><span class="smalltext">${Math.min(pool.length-inspireOffset,20)} shown · ${inspireSelected.size} selected</span><div class="row" style="flex:0 1 auto"><button class="btn secondary small" id="moreinspire" ${inspireOffset+20>=pool.length?'disabled':''}>Show more</button><button class="btn blue small" id="addinspire">Add selected</button></div></div><button class="btn secondary small" id="cancelinspire">Cancel</button>`);document.querySelectorAll(".pick input").forEach(cb=>cb.onchange=()=>{if(cb.checked)inspireSelected.add(cb.value);else inspireSelected.delete(cb.value);if(inspireSelected.size>20){inspireSelected.delete(cb.value);cb.checked=false;alert("Select up to 20 questions at a time.")} });document.getElementById("moreinspire").onclick=()=>{document.querySelectorAll(".pick input:checked").forEach(cb=>inspireSelected.add(cb.value));inspireOffset+=20;inspireModal(current,pool)};document.getElementById("cancelinspire").onclick=closeModal;document.getElementById("addinspire").onclick=()=>{let chosen=pool.filter(q=>inspireSelected.has(q.id));chosen.forEach(q=>{let src=db.episodes.find(e=>e.id===q.sourceId);let original=src?.questions.find(x=>x.id===q.id);if(original&&src.id!==current.id)src.questions=src.questions.filter(x=>x.id!==q.id);if(!current.questions.some(x=>x.text===q.text))current.questions.push({id:uid(),text:q.text,asked:false})});save();closeModal();openEpisode(current.id)}}

document.getElementById("importFile").onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(!incoming||!Array.isArray(incoming.organizers)||!Array.isArray(incoming.conventions)||!Array.isArray(incoming.episodes))throw new Error("This file does not look like a Vault backup.");if(!confirm("Import this backup and replace the data saved on this device? Export a backup first if you want to keep the current data."))return;db=incoming;if(!Array.isArray(db.checklistTemplate))db.checklistTemplate=DEFAULT_CHECKLIST.slice();save();render();alert("Backup imported.");}catch(err){alert("Could not import backup: "+err.message)}finally{e.target.value=""}};
