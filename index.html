function normalizeQuestion(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w\s]/g," ").replace(/\b(what|how|why|when|where|who|which|the|a|an|you|your|of|to|from|about|have|has|is|are|was|were|ever|most)\b/g," ").replace(/\s+/g," ").trim()}
function questionSimilarity(a,b){let A=new Set(normalizeQuestion(a).split(" ").filter(x=>x.length>2)),B=new Set(normalizeQuestion(b).split(" ").filter(x=>x.length>2));if(!A.size||!B.size)return 0;let n=[...A].filter(x=>B.has(x)).length;return n/(A.size+B.size-n)}
function detectDuplicateQuestions(){let rows=[...document.querySelectorAll("#editquestions .qrow")].map(r=>r.querySelector('[aria-label="Question"]')?.value.trim()).filter(Boolean),prior=db.episodes.filter(e=>e.id!==editing).flatMap(e=>(e.questions||[]).map(q=>({text:q.text,ep:epTitle(e)}))),hits=[];rows.forEach(q=>prior.forEach(p=>{let s=questionSimilarity(q,p.text);if(normalizeQuestion(q)===normalizeQuestion(p.text)||s>=.55)hits.push({q,p,s})}));showModal("Duplicate question check",hits.length?hits.slice(0,30).map(x=>`<div class="expense-row"><div><b>${esc(x.q)}</b><div class="smalltext">Similar to "${esc(x.p.text)}" · ${esc(x.p.ep)}</div></div><span class="tag">${Math.round(x.s*100)}%</span></div>`).join(""):'<div class="empty">No likely duplicates found.</div>')}

 for(const e of db.episodes){if(e.conventionId&&!knownConventions.has(e.conventionId))issues.push('Episode '+(e.guest||e.id)+': missing convention');if(e.guestId&&!knownGuests.has(e.guestId))issues.push('Episode '+(e.guest||e.id)+': missing guest profile');}

const VAULT_FORM_DRAFT_PREFIX="vault_form_draft_v410_";
const VAULT_DRAFT_FORMS=new Set(["epform","conform","guestform","orgform","expense-form","venue-form"]);
let vaultDraftTimer=null;
function vaultFormDraftKey(form){
 if(!form||!VAULT_DRAFT_FORMS.has(form.id))return "";
 const id=form.dataset.id||((form.id==='epform')?(editing||'new'):(form.id==='conform')?(window.__draftConventionId||'new'):(form.id==='orgform')?(window.__draftOrganizerId||'new'):(form.id==='expense-form')?(window.budgetConventionId||'new'):(form.id==='venue-form')?(window.__draftVenueId||'new'):'new');
 return VAULT_FORM_DRAFT_PREFIX+form.id+'_'+String(id);
}
function vaultDraftSnapshot(form){
 const values=[...form.querySelectorAll('input,select,textarea')].filter(el=>el.type!=='password'&&el.type!=='file'&&el.type!=='hidden').map((el,i)=>({index:i,name:el.name||'',type:el.type||'',value:el.value,checked:el.type==='checkbox'||el.type==='radio'?el.checked:undefined}));
 const dynamic={};for(const id of ['editquestions','shorts','guestprojectlist','organizerContacts']){
  const box=form.querySelector('#'+id);if(!box)continue;
  const clone=box.cloneNode(true);const old=[...box.querySelectorAll('input,select,textarea')],fresh=[...clone.querySelectorAll('input,select,textarea')];
  old.forEach((el,i)=>{const copy=fresh[i];if(!copy)return;if(el.type==='checkbox'||el.type==='radio')el.checked?copy.setAttribute('checked',''):copy.removeAttribute('checked');else if(el.tagName==='TEXTAREA')copy.textContent=el.value;else if(el.tagName==='SELECT'){[...copy.options].forEach((opt,j)=>j===el.selectedIndex?opt.setAttribute('selected',''):opt.removeAttribute('selected'))}else copy.setAttribute('value',el.value)});
  dynamic[id]=clone.innerHTML;
 }
 return {updatedAt:new Date().toISOString(),values,dynamic};
}
function saveVaultDraft(form){const key=vaultFormDraftKey(form);if(!key)return;try{localStorage.setItem(key,JSON.stringify(vaultDraftSnapshot(form)))}catch(err){console.warn('Draft could not be saved',err)}}
function clearVaultDraft(form){const key=vaultFormDraftKey(form);if(key){clearTimeout(vaultDraftTimer);try{localStorage.removeItem(key)}catch{}}}
function restoreVaultDraft(form){const key=vaultFormDraftKey(form);if(!key)return;
 let data;try{data=JSON.parse(localStorage.getItem(key)||'null')}catch{return}if(!data?.values)return;
 // Only restore drafts for this precise form/entity. No pop-up on every refresh.
 for(const [id,markup] of Object.entries(data.dynamic||{})){
  const box=form.querySelector('#'+id);if(box&&typeof markup==='string'&&markup.length<150000)box.innerHTML=markup;
 }
 const fields=[...form.querySelectorAll('input,select,textarea')].filter(el=>el.type!=='password'&&el.type!=='file'&&el.type!=='hidden');
 for(const item of data.values){const el=fields[item.index];if(!el||el.type!==item.type||el.name!==item.name)continue;
  if(el.type==='checkbox'||el.type==='radio')el.checked=!!item.checked;else el.value=item.value;
 }
 const note=document.createElement('div');note.className='draft-recovered';note.innerHTML='<span>↶ Recovered an unfinished draft from this device.</span><button type="button" class="btn secondary small" id="discardVaultDraft">Discard draft</button>';
 form.prepend(note);note.querySelector('button').onclick=()=>{if(confirm('Discard this draft and reload the saved values?')){clearVaultDraft(form);const title=document.getElementById('modtitle')?.textContent||'';closeModal();if(form.id==='epform')editing?openEpisode(editing):newEpisode();else if(form.id==='guestform')form.dataset.id?editGuest(form.dataset.id):addGuest();else if(form.id==='conform')editConvention(window.__draftConventionId||undefined);else if(form.id==='orgform')editOrganizer(window.__draftOrganizerId||undefined);else if(form.id==='expense-form')addExpense(window.budgetConventionId);else if(form.id==='venue-form')editVenue(window.__draftVenueId||undefined)}};
}

const PROJECT_TYPES=["Film","TV show","Podcast","Book","Other"];
// V1.6.3: migrate project credits from episodes to reusable guest profiles.
function migrateGuestProjects(){
 let changed=false;
 db.episodes.forEach(e=>{
  const g=db.guests.find(x=>x.id===e.guestId)||db.guests.find(x=>normalizeGuestName(x.name)===normalizeGuestName(e.guest));
  if(!g)return;
  if(!Array.isArray(g.projects))g.projects=[];
  (Array.isArray(e.projects)?e.projects:[]).forEach(raw=>{
   const p=raw&&typeof raw==="object"?raw:{title:String(raw||"")};
   const title=String(p.title??p.name??p.project??"").trim();
   if(!title)return;
   const key=title.toLocaleLowerCase();
   const existing=g.projects.find(x=>String(x.title??x.name??"").trim().toLocaleLowerCase()===key);
   if(existing){
    // Keep every field from the episode project, while retaining already-entered guest-profile values.
    Object.keys(p).forEach(k=>{if(existing[k]===undefined||existing[k]===null||existing[k]==="")existing[k]=p[k]});
    if(!existing.title)existing.title=title;
   }else{
    g.projects.push({...p,title,type:PROJECT_TYPES.includes(p.type)?p.type:(p.type||"Other")});
   }
   changed=true;
  });
  if(e.guestId!==g.id){e.guestId=g.id;changed=true}
  if(Array.isArray(e.projects)){delete e.projects;changed=true}
 });
 return changed;
}

function questionEditor(e){return (e.questions||[]).map(q=>`<div class="qrow"><input type="checkbox" ${q.asked?'checked':''} title="Asked"><input style="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px" value="${esc(q.text)}" data-qid="${q.id}" aria-label="Question"><button type="button" class="btn danger small" onclick="this.parentElement.remove()">×</button></div>`).join("")}
function addQuestion(){let box=document.getElementById("editquestions");let div=document.createElement("div");div.className="qrow";div.innerHTML='<input type="checkbox" title="Asked"><input style="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px" aria-label="Question" placeholder="Write a question"><button type="button" class="btn danger small" onclick="this.parentElement.remove()">×</button>';box.appendChild(div)}
function bulkQuestions(){let old=document.getElementById("bulkpanel");if(old){old.remove();return}let panel=document.createElement("div");panel.id="bulkpanel";panel.className="card";panel.style.cssText="margin:12px 0;padding:14px;background:#f8f9fd";panel.innerHTML=`<div class="field"><label>Paste one question per line</label><textarea id="bulktext" rows="6" placeholder="Question one&#10;Question two&#10;Question three"></textarea></div><div class="row"><button type="button" class="btn blue" id="bulkAdd">Add questions</button><button type="button" class="btn secondary" id="bulkCancel">Cancel</button></div>`;document.getElementById("editquestions").after(panel);document.getElementById("bulkAdd").onclick=applyBulk;document.getElementById("bulkCancel").onclick=()=>panel.remove()}
function applyBulk(){let field=document.getElementById("bulktext"),box=document.getElementById("editquestions");if(!field||!box)return;let lines=field.value.split(/\r\n|\n|\r/).map(x=>x.trim()).filter(Boolean);if(!lines.length){alert("Paste at least one question, with one question per line.");return}lines.forEach(text=>{let div=document.createElement("div");div.className="qrow";let check=document.createElement("input");check.type="checkbox";check.title="Asked";let input=document.createElement("input");input.style.cssText="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px";input.setAttribute("aria-label","Question");input.value=text;let remove=document.createElement("button");remove.type="button";remove.className="btn danger small";remove.textContent="×";remove.onclick=()=>div.remove();div.append(check,input,remove);box.appendChild(div)});document.getElementById("bulkpanel")?.remove()}
function shortEditor(e){return (e.shorts||[]).map((s,i)=>`<div class="row" style="margin:8px 0"><select data-shortplatform="${i}"><option ${s.platform==="YouTube"?'selected':''}>YouTube</option><option ${s.platform==="TikTok"?'selected':''}>TikTok</option><option ${s.platform==="Instagram"?'selected':''}>Instagram</option></select><input data-shortlink="${i}" placeholder="Short link" value="${esc(s.link||"")}"><button type="button" class="btn danger small" onclick="this.parentElement.remove()">×</button></div>`).join("")}

function timerStore(){db.settings=db.settings||{};db.settings.interviewTimers=db.settings.interviewTimers||{};return db.settings.interviewTimers}
function timerElapsed(t){return (Number(t?.elapsedMs)||0)+(t?.runningSince?Math.max(0,Date.now()-t.runningSince):0)}
function formatElapsed(ms){let sec=Math.floor(ms/1000),hh=String(Math.floor(sec/3600)).padStart(2,"0"),mm=String(Math.floor(sec%3600/60)).padStart(2,"0"),ss=String(sec%60).padStart(2,"0");return `${hh}:${mm}:${ss}`}
function openInterviewFocusMode(episodeId){

function toggleFocusQuestion(episodeId,index,checked){

function paintInterviewTimer(){let id=activeEpisode,t=timerStore()[id]||{},el=document.getElementById("interviewElapsed"),state=document.getElementById("interviewTimerState");if(el)el.textContent=formatElapsed(timerElapsed(t));const focus=document.getElementById('interviewFocusElapsed');if(focus)focus.textContent=formatElapsed(timerElapsed(t));if(state)state.textContent=t.runningSince?"Timer running":t.elapsedMs?"Paused":"Ready when you are"}
function startInterviewTimer(id){let all=timerStore(),t=all[id]||{elapsedMs:0};if(!t.runningSince)t.runningSince=Date.now();all[id]=t;save();paintInterviewTimer();if(window.__vaultTimerInterval)clearInterval(window.__vaultTimerInterval);window.__vaultTimerInterval=setInterval(paintInterviewTimer,1000)}
function pauseInterviewTimer(id){let all=timerStore(),t=all[id]||{elapsedMs:0};if(t.runningSince){t.elapsedMs=timerElapsed(t);delete t.runningSince}all[id]=t;save();paintInterviewTimer();if(window.__vaultTimerInterval){clearInterval(window.__vaultTimerInterval);window.__vaultTimerInterval=null}}

on></form>`);setupOrganizerPicker();document.getElementById("conform").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let start=fromDMY(f.get("startDate")),end=fromDMY(f.get("endDate"));if(!start||!end){alert("Enter valid dates as DD/MM/YYYY.");return}if(c.id){c.name=f.get("name").trim();c.organizerId=f.get("organizerId");c.startDate=start;c.endDate=end;c.venueId=f.get("venueId")||"";c.hotelName=(f.get("hotelName")||"").trim();c.hotelAddress=(f.get("hotelAddress")||"").trim();c.hotelRoom=(f.get("hotelRoom")||"").trim();c.flights={outbound:{date:f.get("outFlightDate")||"",time:f.get("outFlightTime")||"",flightNumber:f.get("outFlightNumber")||""},return:{date:f.get("returnFlightDate")||"",time:f.get("returnFlightTime")||"",flightNumber:f.get("returnFlightNumber")||""}};c.checklist=db.checklistTemplate.map((_,i)=>f.get("prep"+i)==="on");c.guestIds=db.guests.filter(g=>f.get("guest_"+g.id)==="on").map(g=>g.id)}else db.conventions.push({id:uid(),name:f.get("name").trim(),organizerId:f.get("organizerId"),startDate:start,endDate:end,venueId:f.get("venueId")||"",hotelName:(f.get("hotelName")||"").trim(),hotelAddress:(f.get("hotelAddress")||"").trim(),hotelRoom:(f.get("hotelRoom")||"").trim(),flights:{outbound:{date:f.get("outFlightDate")||"",time:f.get("outFlightTime")||"",flightNumber:f.get("outFlightNumber")||""},return:{date:f.get("returnFlightDate")||"",time:f.get("returnFlightTime")||"",flightNumber:f.get("returnFlightNumber")||""}},checklist:db.checklistTemplate.map((_,i)=>f.get("prep"+i)==="on"),guestIds:db.guests.filter(g=>f.get("guest_"+g.id)==="on").map(g=>g.id),panels:[]});save();closeModal();render()}}
function editChecklistTemplate(){showModal("Edit packing checklist",`<div class="smalltext">One item per line. Changes apply to new conventions and the checklist shown when editing existing ones.</div><textarea id="checklist-template" rows="14" style="width:100%;max-width:100%;height:42vh;max-height:420px;min-height:180px;box-sizing:border-box;overflow-y:auto;resize:vertical;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0">${esc(db.checklistTemplate.join("\n"))}</textarea><div class="row"><button class="btn blue" onclick="saveChecklistTemplate()">Save template</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`)}
function saveChecklistTemplate(){db.checklistTemplate=document.getElementById("checklist-template").value.split(/\n/).map(x=>x.trim()).filter(Boolean);db.conventions.forEach(c=>{c.checklist=db.checklistTemplate.map((_,i)=>!!c.checklist?.[i])});save();closeModal();render()}
function managePanels(conventionId){
 const c=conv(conventionId);if(!c)return;
 if(!Array.isArray(c.panels))c.panels=[];
 const lineup=(c.guestIds||[]).map(id=>db.guests.find(g=>g.id===id)).filter(Boolean);
 showModal("Manage convention panels",`<p class="sub">Build the stage schedule for this convention. Each panel can have its own day, start time, and guest lineup.</p><div class="sectionhead"><h3>Panels</h3><button type="button" class="btn blue small" onclick="addConventionPanel('${c.id}')">＋ Add panel</button></div>${c.panels.slice().sort((a,b)=>(a.day||"").localeCompare(b.day||"")||(a.time||"").localeCompare(b.time||"")).map(p=>`<div class="episode"><div class="epbody"><b>${esc(p.title||"Untitled panel")}</b><div class="epmeta">${esc(p.day||"Day not set")} · ${esc(p.time||"Time not set")}${p.time?`–${esc(addMinutesToTime(p.time,30))}`:""}${p.room?" · "+esc(p.room):""} · ${(p.guestIds||[]).map(id=>esc(db.guests.find(g=>g.id===id)?.name||"")).filter(Boolean).join(", ")||"No guests selected"}</div></div><div class="epactions"><button class="btn secondary small" onclick="editConventionPanel('${c.id}','${p.id}')">Edit</button><button class="btn danger small" onclick="deleteConventionPanel('${c.id}','${p.id}')">Delete</button></div></div>`).join("")||'<div class="empty">No panels added yet.</div>'}<div class="row" style="margin-top:14px"><button class="btn secondary" onclick="closeModal()">Done</button></div>`);
}
function addConventionPanel(conventionId){editConventionPanel(conventionId,null)}
function enforcePanelDuration(){
 db.conventions.forEach(c=>(c.panels||[]).forEach(p=>{p.duration=30}));
}
enforcePanelDuration();
localStorage.setItem("vault03",JSON.stringify(db));
function editConventionPanel(conventionId,panelId){
 const c=conv(conventionId);if(!c)return;if(!Array.isArray(c.panels))c.panels=[];
 const p=c.panels.find(x=>x.id===panelId)||{id:"",title:"",day:"Saturday",time:"",guestIds:[],notes:""};
 const guestOptions=(c.guestIds||[]).map(id=>db.guests.find(g=>g.id===id)).filter(Boolean);
 if(!guestOptions.length){alert("Add guests to this convention first. Edit the convention and select its guest lineup.");return}
 showModal(panelId?"Edit panel":"Add panel",`<form id="panel-form"><div class="field"><label>Panel title</label><input name="title" value="${esc(p.title)}" placeholder="e.g. The world of..." required></div><div class="row"><div class="field"><label>Day</label><select name="day">${["Saturday","Sunday"].map(d=>`<option ${p.day===d?"selected":""}>${d}</option>`).join("")}</select></div><div class="field"><label>Start time</label><input type="time" name="time" value="${esc(p.time)}" required></div></div><div class="field"><label>Room / location</label><input name="room" value="${esc(p.room||"")}" placeholder="e.g. Panel Room A, Interview Room 2"></div><div class="field"><label>Panel duration</label><div class="fixed-duration-display">30 minutes</div><div class="smalltext">All convention panels are scheduled for 30 minutes.</div></div><div class="field"><label>Guests on this panel</label><div class="guest-check-grid">${guestOptions.map(g=>`<label><input type="checkbox" name="panelguest_${g.id}" ${(p.guestIds||[]).includes(g.id)?"checked":""}><span>${esc(g.name)}</span></label>`).join("")}</div></div><div class="field"><label>Notes (optional)</label><textarea name="notes">${esc(p.notes||"")}</textarea></div><div class="row"><button class="btn blue">Save panel</button><button type="button" class="btn secondary" onclick="managePanels('${c.id}')">Cancel</button></div></form>`);
 document.getElementById("panel-form").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const panel={...p,id:p.id||uid(),title:String(f.get("title")||"").trim(),day:f.get("day"),time:f.get("time"),room:String(f.get("room")||"").trim(),duration:30,guestIds:guestOptions.filter(g=>f.get("panelguest_"+g.id)==="on").map(g=>g.id),notes:String(f.get("notes")||"")};if(!panel.guestIds.length&&!confirm("No guests are selected for this panel. Save it anyway?"))return;const i=c.panels.findIndex(x=>x.id===panel.id);if(i<0)c.panels.push(panel);else c.panels[i]=panel;save();managePanels(c.id)};
}
function deleteConventionPanel(conventionId,panelId){const c=conv(conventionId);if(!c||!confirm("Delete this panel?"))return;c.panels=(c.panels||[]).filter(p=>p.id!==panelId);save();managePanels(c.id)}
function duplicateConvention(id){const c=db.conventions.find(x=>x.id===id);if(!c)return;db.conventions.push({id:uid(),name:c.name+" (Copy)",organizerId:c.organizerId,startDate:c.startDate,endDate:c.endDate,hotelName:c.hotelName||"",hotelAddress:c.hotelAddress||"",hotelRoom:c.hotelRoom||"",checklist:[false,false,false,false,false,false],guestIds:(c.guestIds||[]).slice(),flights:JSON.parse(JSON.stringify(c.flights||{})),panels:[]});save();render()}
function delConvention(id){let n=db.episodes.filter(e=>e.conventionId===id).length;if(!confirm(n?`This convention is linked to ${n} episode(s). Delete the convention? Episodes will remain, with the convention shown as TBD.`:"Delete convention?"))return;db.conventions=db.conventions.filter(c=>c.id!==id);save();render()}
function getInspired(eid){let current=db.episodes.find(x=>x.id===eid)||db.episodes.find(x=>x.id===activeEpisode);if(!current){alert("Save this episode first, then use Get Inspired.");return}let today=new Date();today.setHours(0,0,0,0);let pool=db.episodes.flatMap(e=>{let c=db.conventions.find(c=>c.id===e.conventionId);if(!c||!c.endDate)return[];let end=new Date(c.endDate+"T00:00:00");if(Number.isNaN(end.getTime())||end>=today)return[];return(e.questions||[]).filter(q=>q&&String(q.text||"").trim()&&q.asked!==true).map(q=>({...q,source:e,sourceId:e.id}))});let editorRows=[...document.querySelectorAll("#editquestions .qrow")].map(r=>({id:r.querySelector("[data-qid]")?.dataset.qid||uid(),text:r.querySelector('input[aria-label="Question"]')?.value.trim()||r.querySelector('input:not([type=checkbox])')?.value.trim()||"",asked:r.querySelector('input[type=checkbox]')?.checked||false})).filter(q=>q.text&&!q.asked);editorRows.forEach(q=>{if(!pool.some(p=>p.text===q.text))pool.push({...q,source:current,sourceId:current.id,unsaved:true})});pool=pool.filter((q,i,a)=>a.findIndex(x=>x.text.toLowerCase()===q.text.toLowerCase())===i);inspireOffset=0;inspireSelected=new Set();inspireModal(current,pool)}
function inspireModal(current,pool){let batch=pool.slice(inspireOffset,inspireOffset+20);showModal("✦ Get Inspired",`<p class="sub">Choose up to 20 unused questions. Selected questions are moved into this interview: they are removed from their original interview and added here. Any questions already entered here will be kept.</p><div class="picklist">${batch.map(q=>`<label class="pick"><input type="checkbox" value="${q.id}" ${inspireSelected.has(q.id)?'checked':''}><span><b>${esc(q.text)}</b><div class="smalltext">From ${esc(epTitle(q.source))}</div></span></label>`).join("")||'<div class="empty">No more unused questions in this batch.</div>'}</div><div class="sectionhead" style="margin-top:14px"><span class="smalltext">${Math.min(pool.length-inspireOffset,20)} shown · ${inspireSelected.size} selected</span><div class="row" style="flex:0 1 auto"><button class="btn secondary small" id="moreinspire" ${inspireOffset+20>=pool.length?'disabled':''}>Show more</button><button class="btn blue small" id="addinspire">Add selected</button></div></div><button class="btn secondary small" id="cancelinspire">Cancel</button>`);document.querySelectorAll(".pick input").forEach(cb=>cb.onchange=()=>{if(cb.checked)inspireSelected.add(cb.value);else inspireSelected.delete(cb.value);if(inspireSelected.size>20){inspireSelected.delete(cb.value);cb.checked=false;alert("Select up to 20 questions at a time.")} });document.getElementById("moreinspire").onclick=()=>{document.querySelectorAll(".pick input:checked").forEach(cb=>inspireSelected.add(cb.value));inspireOffset+=20;inspireModal(current,pool)};document.getElementById("cancelinspire").onclick=closeModal;document.getElementById("addinspire").onclick=()=>{let chosen=pool.filter(q=>inspireSelected.has(q.id));chosen.forEach(q=>{const text=String(q.text||"").trim();if(!text)return;const exists=(current.questions||[]).some(x=>String(x.text||"").trim().toLowerCase()===text.toLowerCase());if(!exists)current.questions.push({id:uid(),text,asked:false});if(!q.unsaved&&q.sourceId&&q.sourceId!==current.id){const source=db.episodes.find(e=>e.id===q.sourceId);if(source&&Array.isArray(source.questions)){let removed=false;source.questions=source.questions.filter(x=>{if(!removed&&q.id&&x.id===q.id){removed=true;return false}return true});if(!removed){let idx=source.questions.findIndex(x=>String(x.text||"").trim().toLowerCase()===text.toLowerCase());if(idx!==-1)source.questions.splice(idx,1)}}}});save();closeModal();openEpisode(current.id)}}
function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="the-vault-backup.json";a.click();URL.revokeObjectURL(a.href)}
document.getElementById("exportBtn").onclick=exportBackup;
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(!incoming||!Array.isArray(incoming.organizers)||!Array.isArray(incoming.conventions)||!Array.isArray(incoming.episodes))throw new Error("This file does not look like a Vault backup.");if(!confirm("Import this backup and replace the data saved on this device? Export a backup first if you want to keep the current data."))return;preserveVaultSafetyBackup("Before JSON import");db=incoming;if(!Array.isArray(db.checklistTemplate))db.checklistTemplate=DEFAULT_CHECKLIST.slice();save();render();alert("Backup imported.");}catch(err){alert("Could not import backup: "+err.message)}finally{e.target.value=""}};
document.getElementById("cloudBtn").onclick=openAccountSync;

render();
